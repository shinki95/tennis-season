<style>
:root{--blue:#2F5BFF;--blue2:#2149E6;--lime:#D4F25A;--lime2:#C2E23C;--ink:#111318;--bg:#EEF1F6;--card:#fff;--mut:#6B7280;--line:#E6E9EF;--dark:#15171C;--g:#3BA55C;--o:#E39A1B;--r:#E5484D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.num{font-family:"Chakra Petch",Pretendard,sans-serif;font-weight:700}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:560px;margin:0 auto}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:rgba(255,255,255,.12);border-radius:20px;padding:8px 0 7px;text-align:center;position:relative}
.day .dn{font-size:11px;opacity:.8}.day .dd{font-size:16px;margin-top:2px}

main{padding:0 14px}

.card.lime{background:var(--lime)}
.card.dark{background:var(--dark);color:#fff}.card.dark .sub{color:#9CA3AF}

h2{font-size:17px;margin:0;font-weight:800}

.digits{display:flex;gap:6px}.digits b{background:rgba(255,255,255,.55);border-radius:12px;width:46px;height:60px;display:flex;align-items:center;justify-content:center;font-size:40px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 0}

.nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;background:var(--ink);border-radius:32px;display:flex;align-items:center;justify-content:space-between;padding:7px;z-index:10;box-shadow:0 8px 24px rgba(17,19,24,.25)}

.cal{display:grid;grid-template-columns:24px repeat(7,1fr);row-gap:6px;text-align:center}

.cal .wn{font-size:10px;color:#9CA3AF;display:flex;align-items:center;justify-content:center;font-weight:700}

.cal .c .ds{display:flex;gap:2px;height:6px}.cal .c .ds i{width:6px;height:6px;border-radius:50%}
.cal .c.band .n{background:#EEF3FF}
.leg{display:flex;gap:12px;font-size:11px;color:var(--mut);flex-wrap:wrap;margin-top:10px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700;background:#F1F3F7;color:#4B5563;white-space:nowrap}
svg.ch{width:100%;height:auto;display:block}
.btn{border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;background:#F1F3F7}
.btn.p{background:var(--ink);color:#fff}.btn.lm{background:var(--lime);color:var(--ink)}.btn.d{color:var(--r)}.btn.s{padding:7px 12px;font-size:13px;border-radius:11px}.btn.w{width:100%}
input,select,textarea{font-family:inherit;font-size:16px;max-width:100%}
input[type=date],input[type=text],input[type=number],select,textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input[type=number]{width:92px}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--mut);font-weight:600}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:5px;font-weight:400}
.tog{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;margin:3px 5px 3px 0}
.tog.y{background:var(--ink);border-color:var(--ink);color:#fff}
.drill{background:#F6F7FA;border-radius:16px;padding:11px 12px;margin-top:8px}
.drill .ps{color:var(--g);font-size:13px;margin-top:4px;font-weight:600}.drill .cu{color:var(--o);font-size:13px;margin-top:3px}
.mrow{background:#F6F7FA;border-radius:16px;padding:10px 12px;margin-top:8px}
#sheet{position:fixed;inset:0;background:rgba(17,19,24,.45);display:none;z-index:30;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.grab{width:44px;height:5px;border-radius:9px;background:#D5D9E0;margin:0 auto 12px}
h3{font-size:14px;margin:16px 0 6px;font-weight:800}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:8px;font-weight:600}
.login{min-height:100vh;background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 22px calc(40px + env(safe-area-inset-bottom))}
.login h1{font-size:54px;line-height:1;margin:0;font-weight:800;letter-spacing:-1.5px}.login h1 span{color:var(--lime)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--ink);border-radius:18px;padding:16px;font-size:16px;font-weight:800;margin-top:28px;width:100%}
.sync{font-size:11px;color:rgba(255,255,255,.7)}
.note textarea{width:100%;min-height:62px;margin-top:5px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.kv span{background:#F1F3F7;border-radius:10px;padding:6px 10px;font-size:13px}

/* 원래 초록 색 (사장님 2026-11-22 "색깔 원래버전이 나은 거 같아") */
:root{--blue:#2F7D4F;--blue2:#1F5E3B;--lime:#E6F2E9}
.top{background:linear-gradient(135deg,#1F5E3B,#2F7D4F)}
.av{background:#fff;color:#1F5E3B}
.day.sel{background:#fff;color:#1F5E3B}
.card.lime{background:linear-gradient(135deg,#1F5E3B,#2F7D4F);color:#fff}
.card.lime .lbl{color:#CFE8D7}
.card.lime .tag{background:rgba(255,255,255,.18)!important;color:#fff}
.card.lime .ev{border-color:rgba(255,255,255,.15)}
.card.lime .pill{background:#fff;color:#1F5E3B}
.digits b{background:rgba(255,255,255,.16);color:#fff}
.pbar i{background:#2F7D4F}
.seg button.on{background:#2F7D4F;color:#fff}
.nav button.on{background:#2F7D4F;color:#fff}
.ck.y{background:#2F7D4F;border-color:#2F7D4F;color:#fff}
.btn.lm{background:#2F7D4F;color:#fff}
.pill.lm{background:#fff;color:#1F5E3B}
.cal .c.sel .n{background:#2F7D4F;color:#fff}
.cal .c.band .n{background:#E6F2E9}
.login{background:linear-gradient(160deg,#1F5E3B,#2F7D4F)}
.login h1 span{color:#B9E4C6}
.g{color:#2F7D4F}
</style>

<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
'use strict';
/* 화면(엔진)만. 대회·요소·드릴 내용은 저장소 데이터(훈련 프로그램)에서 온다. */
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ds(new Date());
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const DOW=['일','월','화','수','목','금','토'];
const dw=s=>DOW[pd(s).getDay()];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const $=id=>document.getElementById(id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wd=d=>Math.floor(d/7)+'주 '+(d%7)+'일';
const I={home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',note:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>',plus:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',l:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',r:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',dots:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'};
const WHO={solo:'혼자',one:'상대 1명과',partner:'복식 파트너와',four:'4명 (복식 상대 포함)'};
const SRC={sv:'SwingVision 무료',svpro:'SwingVision Pro',other_app:'다른 앱',video:'영상 보고 셈',count:'직접 세기',timer:'스톱워치'};
const KIND={drill:{n:'드릴',c:'#3BA55C',i:'드'},rally:{n:'랠리',c:'#2F5BFF',i:'랠'},game:{n:'게임',c:'#E39A1B',i:'게'},league:{n:'리그·대회',c:'#E5484D',i:'리'}};
const ETYPE={league:'리그',tournament:'대회',event:'이벤트·클리닉',deadline:'마감'};
const DISCN={S:'단식',D:'복식',SD:'단식·복식','':'해당 없음'};
const PRIC={A:'#E5484D',B:'#E39A1B',C:'#9CA3AF'};
const evColor=e=>e.type==='deadline'?'#111318':PRIC[e.pri||'C'];
const evMark=e=>e.type==='deadline'?'!':(e.pri||'C');
const DEF_SETTINGS={id:'main',planStart:'2026-11-23',level:{S:{cur:'NTRP 3.5 (자가)',goal:'4.0 상대와 대등'},D:{cur:'NTRP 3.5 (자가)',goal:'혼복 7.0~8.0 라인 50% 승'}}};
let SEED={events:[],factors:[],templates:[],session:{}};

/* ===== 데이터·동기화 ===== */
const COLS=['logs','factors','events','settings','todos','notes'];
let db=loadCache(),outbox=JSON.parse(localStorage.getItem('ts4.outbox')||'[]'),net={state:'',authed:null,email:''};
function loadCache(){try{const c=JSON.parse(localStorage.getItem('ts4.cache'));if(c&&c.logs){COLS.forEach(k=>c[k]=c[k]||[]);return c}}catch(e){}const o={};COLS.forEach(k=>o[k]=[]);return o}
function saveCache(){localStorage.setItem('ts4.cache',JSON.stringify(db));localStorage.setItem('ts4.outbox',JSON.stringify(outbox))}
const EV=()=>(db.events.length?db.events:SEED.events).filter(e=>e.type!=='off').slice().sort((a,b)=>a.start<b.start?-1:1);
const FA=()=>(db.factors.length?db.factors:SEED.factors).slice().sort((a,b)=>(a.order||99)-(b.order||99));
const AF=()=>FA().filter(f=>f.active!==false);
function ST(){const s=db.settings.find(x=>x.id==='main')||{};const o=JSON.parse(JSON.stringify(DEF_SETTINGS));return {...o,...s,level:{...o.level,...(s.level||{})}}}
const PROG=()=>db.settings.find(x=>x.id==='program')||SEED.session||{};
function applyLocal(op){const arr=db[op.collection];for(const u of op.upserts||[]){const i=arr.findIndex(r=>r.id===u.id);if(i>=0)arr[i]={...arr[i],...u};else arr.push(u)}for(const id of op.deletes||[]){const i=arr.findIndex(r=>r.id===id);if(i>=0)arr.splice(i,1)}}
function upsert(c,rec){rec._u=new Date().toISOString();const op={collection:c,upserts:[rec]};applyLocal(op);outbox.push(op);saveCache();_plan=null;render();flush()}
function del(c,id){const op={collection:c,deletes:[id]};applyLocal(op);outbox.push(op);saveCache();_plan=null;render();flush()}
let flushing=false;
async function flush(){if(flushing)return;flushing=true;
 try{while(outbox.length){const r=await fetch('/api/db',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(outbox[0])});
  if(r.status===401){net.authed=false;break}if(!r.ok){net.state='err';break}outbox.shift();saveCache();net.state='ok'}}catch(e){net.state='offline'}
 flushing=false;syncLabel()}
async function pull(){try{const me=await (await fetch('/api/auth?me=1',{credentials:'same-origin'})).json();net.authed=!!me.authed;net.email=me.email||'';
  if(!me.authed){render();return}
  const r=await fetch('/api/db',{credentials:'same-origin'});if(!r.ok)throw 0;const d=await r.json();
  COLS.forEach(k=>db[k]=d[k]||[]);outbox.forEach(applyLocal);saveCache();net.state='ok';_plan=null;await flush()}catch(e){net.state='offline';if(net.authed===null)net.authed=!!localStorage.getItem('ts4.cache')}
 render()}
function syncLabel(){const el=$('sync');if(!el)return;const n=outbox.length;el.textContent=net.state==='offline'?(n?`오프라인 · ${n}개 대기`:'오프라인'):net.state==='err'?'저장 재시도 중':n?`저장 중 ${n}`:net.state==='ok'?'저장됨':''}
setInterval(()=>{if(outbox.length&&net.authed)flush()},15000);addEventListener('online',flush);

/* ===== 계획 ===== */
const w0=()=>mon(ST().planStart);
const wkOf=d=>Math.floor(diffD(w0(),mon(d))/7)+1;

const Aevents=()=>EV().filter(e=>e.pri==='A'&&(e.type==='league'||e.type==='tournament'));

  for(const fid of F.focus||[]){const f=FA().find(x=>x.id===fid);if(!f)continue;const L=(f.drills||[]).map((d,j)=>({d,j})).filter(o=>!F.who||o.d.who===F.who);

 if(isG){h+=`<h3>스코어</h3><div class="row"><span>내 게임</span><input type="number" inputmode="numeric" data-f="gw" value="${F.gw!=null?F.gw:''}" style="width:70px"><span>상대</span><input type="number" inputmode="numeric" data-f="gl" value="${F.gl!=null?F.gl:''}" style="width:70px"></div><input type="text" data-f="score" placeholder="세트 스코어 (예: 6-4 3-6 10-8)" value="${esc(F.score||'')}" style="width:100%;margin-top:8px">`;
  if(F.kind==='league')h+=`<label class="f">어느 대회<select data-f="evId"><option value="">-</option>${EV().filter(e=>e.type==='league'||e.type==='tournament').map(e=>`<option value="${e.id}" ${F.evId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>`}
 h+=`<h3>숫자</h3><div class="row"><span class="sub">출처</span><select data-f="src">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${(F.src||'sv')===k?'selected':''}>${v}</option>`).join('')}</select></div>`;
 for(const m of allMetrics().filter(m=>discOk(m.f.disc,F.disc)&&(isG||!m.gameOnly)))h+=`<div class="mrow row sb"><div style="flex:1;min-width:140px"><b>${esc(m.name)}</b></div><div class="row" style="flex-wrap:nowrap"><input type="number" inputmode="decimal" step="any" data-f="vals.${m.id}" value="${(F.vals||{})[m.id]!=null?F.vals[m.id]:''}"><span class="sub">${esc(m.unit||'')}</span></div></div>`;
 return h+`<div style="margin-top:12px"><label><input type="checkbox" data-f="filmed" ${F.filmed?'checked':''}> 촬영함 (숫자는 나중에 분석)</label></div><input type="text" data-f="note" placeholder="한 줄 메모" value="${esc(F.note||'')}" style="width:100%;margin-top:12px"><div class="row" style="margin-top:14px"><button class="btn lm" style="flex:1" data-a="recSave">저장</button>${F._edit?'<button class="btn d" data-a="recDel">삭제</button>':''}</div>`}
const shift=(k,n)=>`<button class="btn s" data-a="shift" data-k="${k}" data-v="${n}">${n>0?'+':''}${Math.abs(n)%7===0?(n/7)+'주':n+'일'}</button>`;
function sEv(){let h=shd(F._edit?'대회·일정 고치기':'대회·일정 추가')+`<label class="f">이름<input type="text" data-f="name" value="${esc(F.name||'')}" placeholder="예: UTR Flex 단식"></label><h3>종류</h3><div>${Object.entries(ETYPE).map(([k,v])=>`<button class="tog ${F.type===k?'y':''}" data-a="ef" data-k="type" data-v="${k}">${v}</button>`).join('')}</div><h3>종목</h3><div>${['S','D','SD',''].map(k=>`<button class="tog ${F.disc===k?'y':''}" data-a="ef" data-k="disc" data-v="${k}">${DISCN[k]}</button>`).join('')}</div>`;
 h+=`<div class="row" style="margin-top:4px"><label class="f" style="flex:1">시작<input type="date" data-f="start" value="${F.start||''}"></label><label class="f" style="flex:1">끝<input type="date" data-f="end" value="${F.end||''}"></label></div><div class="row" style="margin-top:8px"><span class="sub">통째로 옮기기</span>${shift('ev',-7)}${shift('ev',-1)}${shift('ev',1)}${shift('ev',7)}</div>`;
 if(F.type!=='deadline')h+=`<h3>우선순위</h3><div>${[['A','A · 여기에 맞춰 계획'],['B','B · 계획 유지하며 참가'],['C','C · 그냥 참가']].map(([k,v])=>`<button class="tog ${F.pri===k?'y':''}" data-a="ef" data-k="pri" data-v="${k}">${v}</button>`).join('')}</div><label class="f">목표 한 줄<input type="text" data-f="goal" value="${esc(F.goal||'')}"></label>`;

function sTodo(){const t=today();return shd(F._new?'할 일 추가':'할 일')+`<label class="f">내용<input type="text" data-f="title" value="${esc(F.title||'')}" placeholder="예: Ten-Fifty5에 경기 영상 올리기"></label><label class="f">날짜<input type="date" data-f="date" value="${F.date||''}"></label><div class="row" style="margin-top:8px"><button class="btn s" data-a="tdate" data-v="${t}">오늘</button><button class="btn s" data-a="tdate" data-v="${addD(t,1)}">내일</button>${shift('todo',1)}${shift('todo',7)}<button class="btn s" data-a="tdate" data-v="">날짜 없음</button></div><div class="row" style="margin-top:16px"><button class="btn lm" style="flex:1" data-a="todoSave">저장</button>${F._new?'':`<button class="btn d" data-a="todoDel">${F.auto?'이번 주에서 빼기':'삭제'}</button>`}</div>`}
function sFac(){let h=shd(F._edit?'요소 편집':'요소 추가');
 if(!F._edit&&!F._picked)return h+`<div class="sub" style="margin-top:6px">템플릿에서 시작하거나 직접 만들어요.</div>${(SEED.templates||[]).map((t,i)=>`<button class="btn w" style="margin-top:8px;text-align:left" data-a="facTpl" data-i="${i}"><b>${esc(t.name)}</b><br><span class="sub">${esc(t.metrics.map(m=>m.name).join(' / '))}</span></button>`).join('')}`;
 h+=`<label class="f">이름<input type="text" data-f="name" value="${esc(F.name||'')}"></label><h3>종목</h3><div>${['S','D','SD'].map(k=>`<button class="tog ${F.disc===k?'y':''}" data-a="ff" data-k="disc" data-v="${k}">${DISCN[k]}</button>`).join('')}</div><label class="f">왜 중요한가<textarea data-f="why" rows="2">${esc(F.why||'')}</textarea></label><div style="margin-top:10px"><label><input type="checkbox" data-f="active" ${F.active!==false?'checked':''}> 사용</label></div><h3>측정</h3>`;
 (F.metrics||[]).forEach((m,i)=>{h+=`<div class="mrow"><div class="row"><input type="text" data-f="metrics.${i}.name" value="${esc(m.name||'')}" style="flex:1;min-width:140px"><button class="btn s d" data-a="fdel" data-k="metrics" data-i="${i}">빼기</button></div><div class="row" style="margin-top:6px"><select data-f="metrics.${i}.unit">${['%','개','회','초','mph','점'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select><select data-f="metrics.${i}.dir"><option value="1" ${+m.dir!==-1?'selected':''}>높을수록 좋음</option><option value="-1" ${+m.dir===-1?'selected':''}>낮을수록 좋음</option></select><select data-f="metrics.${i}.src">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${m.src===k?'selected':''}>${v}</option>`).join('')}</select></div><input type="text" data-f="metrics.${i}.how" placeholder="어디서 읽나" value="${esc(m.how||'')}" style="width:100%;margin-top:6px"><div class="row" style="margin-top:6px"><span class="sub">목표 개막</span><input type="number" step="any" data-f="metrics.${i}.t1" value="${m.t1!=null?m.t1:''}" placeholder="자동" style="width:76px"><span class="sub">끝</span><input type="number" step="any" data-f="metrics.${i}.t2" value="${m.t2!=null?m.t2:''}" placeholder="자동" style="width:76px"><label class="sub"><input type="checkbox" data-f="metrics.${i}.gameOnly" ${m.gameOnly?'checked':''}> 게임만</label></div></div>`});
 h+=`<button class="btn s" style="margin-top:8px" data-a="fadd" data-k="metrics">+ 측정</button><h3>드릴</h3>`;
 (F.drills||[]).forEach((d,i)=>{h+=`<div class="mrow"><div class="row"><input type="text" data-f="drills.${i}.name" value="${esc(d.name||'')}" style="flex:1;min-width:140px"><select data-f="drills.${i}.who">${Object.entries(WHO).map(([k,v])=>`<option value="${k}" ${d.who===k?'selected':''}>${v}</option>`).join('')}</select><button class="btn s d" data-a="fdel" data-k="drills" data-i="${i}">빼기</button></div><input type="text" data-f="drills.${i}.how" placeholder="어떻게" value="${esc(d.how||'')}" style="width:100%;margin-top:6px"><input type="text" data-f="drills.${i}.pass" placeholder="통과 기준" value="${esc(d.pass||'')}" style="width:100%;margin-top:6px"></div>`});
 return h+`<button class="btn s" style="margin-top:8px" data-a="fadd" data-k="drills">+ 드릴</button><div class="row" style="margin-top:16px"><button class="btn lm" style="flex:1" data-a="facSave">저장</button>${F._edit?'<button class="btn d" data-a="facDel">요소 삭제</button>':''}</div>`}
function sSwap(){const t=today(),typed=!F.type||F.type==='session'||F.kind;
 return shd(F._new?'할 일 추가':'바꾸기')+(typed?`<h3>종류</h3><div>${Object.entries(KINDN).map(([k,v])=>`<button class="tog ${F.kind===k?'y':''}" data-a="swSet" data-k="kind" data-v="${k}">${v}</button>`).join('')}</div><h3>종목</h3><div>${['S','D'].map(k=>`<button class="tog ${(F.disc||'S')===k?'y':''}" data-a="swSet" data-k="disc" data-v="${k}">${DISCN[k]}</button>`).join('')}</div><label class="f">메모<input type="text" data-f="memo" value="${esc(F.memo||'')}" placeholder="선택"></label>`:`<label class="f">내용<input type="text" data-f="title" value="${esc(F.title||'')}"></label>`)+`<h3>언제</h3><div class="row"><button class="tog ${F.date===t?'y':''}" data-a="tdate" data-v="${t}">오늘</button><button class="tog ${F.date===addD(t,1)?'y':''}" data-a="tdate" data-v="${addD(t,1)}">내일</button><input type="date" data-f="date" value="${F.date||''}"></div><div class="row" style="margin-top:16px"><button class="btn lm" style="flex:1" data-a="todoSave">저장</button>${F._new?'':'<button class="btn d" data-a="todoDel">빼기</button>'}</div>`}
function sWeek(){const n=wkOf(sel);return shd(`W${n} 할 일`)+weekTodos(n).map(x=>todoRow(x).replace('<div class="td">',`<div class="td"><span class="dt">${x.date?dw(x.date):'-'}</span>`)).join('')}
function sLv(){const st=ST();return shd('수준')+['S','D'].map(d=>`<h3>${DISCN[d]}</h3><label class="f">현재<input type="text" data-f="level.${d}.cur" value="${esc(st.level[d].cur)}"></label><label class="f">목표<input type="text" data-f="level.${d}.goal" value="${esc(st.level[d].goal)}"></label>`).join('')+`<button class="btn lm w" style="margin-top:14px" data-a="lvSave">저장</button>`}
function sAcct(){return shd('계정')+`<div class="sub" style="margin-top:8px">${esc(net.email||'')}</div><label class="f">계획 시작 주<input type="date" data-f="planStart" value="${ST().planStart}"></label><div class="row" style="margin-top:14px"><button class="btn lm" style="flex:1" data-a="acctSave">저장</button><button class="btn d" data-a="logout">로그아웃</button></div>`}

const act={
 login:()=>{location.href='/api/auth?start=1'},

 weekList:()=>{F={};openSheet('week')},
 todoEdit:d=>{const x=weekTodos(wkOf(sel)).find(t=>t.id===d.id)||db.todos.find(t=>t.id===d.id);if(!x)return;F={...x};openSheet('todo')},
 tdate:d=>{grab();F.date=d.v;drawSheet()},
 todoSave:()=>{grab();const typed=F.kind&&(F._new||F.type==='session'||F.custom||F.kind);if(typed)F.title=(F.kind==='league'?'리그 경기':`${DISCN[F.disc||'S']} ${KINDN[F.kind]}`)+(F.memo?` · ${F.memo}`:'');if(!F.title){alert('내용을 넣어 주세요');return}const r={id:F.id||uid('t'),title:F.title,date:F.date||'',kind:F.kind,disc:F.disc,memo:F.memo||''};if(F._new||F.custom){r.custom=true;r.week=r.date?wkOf(r.date):wkOf(sel)}const ex=db.todos.find(t=>t.id===r.id);hideSheet();upsert('todos',{...(ex||{}),...r})},
 todoDel:()=>{const id=F.id,auto=F.auto;hideSheet();if(auto)upsert('todos',{...(db.todos.find(t=>t.id===id)||{}),id,hidden:true});else del('todos',id)},
 todoTog:d=>{const inSheet=SK==='week';const x0=dayTodos(sel).find(t=>t.id===d.id)||weekTodos(wkOf(sel)).find(t=>t.id===d.id);let lid=x0&&x0.logId;if(x0&&!x0.done&&x0.kind&&x0.type!=='retro')lid=ensureLog(x0,{});const x=x0||db.todos.find(t=>t.id===d.id);if(!x)return;upsert('todos',{...(db.todos.find(t=>t.id===d.id)||{}),id:d.id,done:!x.done,...(lid?{logId:lid}:{}),...(x.custom?{custom:true,title:x.title,date:x.date,week:x.week}:{})});if(inSheet)drawSheet()},
 noteSave:d=>{const o={id:`W${d.n}`,week:+d.n};document.querySelectorAll('[data-n]').forEach(el=>{if(el.tagName==='TEXTAREA')o[el.dataset.n]=el.value.trim()});upsert('notes',{...(db.notes.find(x=>x.id===o.id)||{}),...o})},
 noteGo:d=>{sel=wkStart(+d.n);render();scrollTo(0,0)},
 facGo:d=>{tab='prog';render();const el=$('fac-'+d.id);if(el)el.scrollIntoView({block:'start'})},
 facNew:()=>{F={};openSheet('fac')},
 facTpl:d=>{const t=JSON.parse(JSON.stringify(SEED.templates[+d.i]));F={name:t.name,disc:t.disc,why:'',active:true,metrics:t.metrics.map(m=>({...m,id:uid('m')})),drills:[],order:FA().length+1,_picked:true};drawSheet()},
 facEdit:d=>{const f=FA().find(x=>x.id===d.id);if(!f)return;F={...JSON.parse(JSON.stringify(f)),_edit:true};openSheet('fac')},
 ff:d=>{grab();F[d.k]=d.v;drawSheet()},
 fadd:d=>{grab();F[d.k]=F[d.k]||[];F[d.k].push(d.k==='metrics'?{id:uid('m'),name:'',unit:'%',dir:1,src:'sv',how:''}:{who:'one',name:'',how:'',pass:''});drawSheet()},
 fdel:d=>{grab();F[d.k].splice(+d.i,1);drawSheet()},
 facSave:()=>{grab();if(!F.name){alert('이름을 넣어 주세요');return}const r={...F};delete r._edit;delete r._picked;if(!r.id)r.id=uid('f');(r.metrics||[]).forEach(m=>{m.dir=+m.dir===-1?-1:1;if(!m.id)m.id=uid('m');['t1','t2'].forEach(k=>{if(m[k]==='')delete m[k]})});r.metrics=(r.metrics||[]).filter(m=>m.name);r.drills=(r.drills||[]).filter(x=>x.name);hideSheet();upsert('factors',r)},
 facDel:()=>{if(!confirm('이 요소를 지울까요? (기록 숫자는 남아요)'))return;const id=F.id;hideSheet();del('factors',id)},
 lvEdit:()=>{F={};openSheet('lv')},
 lvSave:()=>{grab();const st=ST();const s={...st,level:{S:{...st.level.S,...((F.level||{}).S||{})},D:{...st.level.D,...((F.level||{}).D||{})}}};hideSheet();upsert('settings',s)},
 calMode:d=>{calMode=d.v;render()},
 calNav:d=>{const[y,m]=calMonth.split('-').map(Number);calMonth=ds(new Date(y,m-1+ +d.v,1,12)).slice(0,7);render()},
 close:()=>hideSheet()
};
document.addEventListener('click',e=>{if(e.target.id==='sheet'){hideSheet();return}const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;const f=act[b.dataset.a];if(f){e.preventDefault();e.stopPropagation();f(b.dataset,b)}},true);
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.edate;if(id&&e.target.value){act.setK({id,k:'date',v:e.target.value})}});
fetch('/seed.json').then(r=>r.ok?r.json():null).then(s=>{if(s){SEED=s;_plan=null;render()}}).catch(()=>{});
if(localStorage.getItem('ts4.cache'))net.authed=true;
render();pull();
</script>
</body>
