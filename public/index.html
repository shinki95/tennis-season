<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="테니스 시즌">
<title>테니스 시즌</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1b211e;--mut:#6b736e;--line:#e3e6e0;--acc:#2f7d4f;--acc2:#e6f2e9;--warn:#c27c0e;--warn2:#fbf1e2;--bad:#b33a3a;--bad2:#f8e8e8;--blue:#3a6fb3;--A:#b33a3a;--B:#d08a1c;--C:#8b939a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 6px}
h3{font-size:14px;margin:12px 0 4px}
main{padding:0 12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 0 13px;font-size:14px;color:var(--mut);font-family:inherit}
nav button.on{color:var(--acc);font-weight:700}
nav .plus{flex:0 0 64px;position:relative}
nav .plus span{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;line-height:52px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:14px;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.d{color:var(--bad)}
.btn.s{padding:5px 9px;font-size:13px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.sub{color:var(--mut);font-size:13px}
.small{font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;background:#eef0ec;color:#59615c;white-space:nowrap}
.seg{display:flex;background:#e8eae5;border-radius:11px;padding:3px;margin:10px 0 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tog{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;margin:3px 4px 3px 0}
.tog.y{background:var(--acc2);border-color:#9fcfb0;color:var(--acc);font-weight:700}
.tog.n{background:var(--bad2);border-color:#e2b3b3;color:var(--bad)}
.hero{background:linear-gradient(135deg,#1f5e3b,#2f7d4f);color:#fff;border:0}
.hero .sub{color:#d6eadc}
.big{font-size:30px;font-weight:800;line-height:1.1}
.evs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:10px}
.ev{flex:0 0 auto;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;font-size:12px;min-width:118px;cursor:pointer}
.ev b{display:block;font-size:13px}
.pri{display:inline-block;width:18px;height:18px;border-radius:5px;color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:18px;margin-right:5px}
.wk{display:flex;gap:14px;align-items:center}
.todo{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid #c9cec7;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.box.y{background:var(--acc);border-color:var(--acc)}
.pace{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.pace:first-of-type{border-top:0}
.pbar{position:relative;height:10px;background:#eceee9;border-radius:9px;margin-top:6px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.pbar em{position:absolute;top:-4px;width:2px;height:18px;background:#1b211e}
.st{font-size:12px;font-weight:700}
.g{color:var(--acc)}.o{color:var(--warn)}.r{color:var(--bad)}.m{color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:16px;max-width:100%}
input[type=date],input[type=text],input[type=number],select,textarea{padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}
input[type=number]{width:86px}
label.f{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.cal{display:grid;grid-template-columns:30px repeat(7,1fr) 34px;gap:2px;font-size:11px}
.cal .h{color:var(--mut);text-align:center;padding:3px 0;font-weight:600}
.cal .wn{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border-radius:6px;font-size:10px}
.cal .c{background:#fff;border:1px solid var(--line);border-radius:7px;min-height:52px;padding:2px 2px 3px;cursor:pointer;overflow:hidden}
.cal .c.x{background:#f7f8f6;color:#b4b9b5}
.cal .c.t{border:2px solid var(--blue)}
.cal .c .d{font-weight:600;font-size:11px}
.cal .bar{height:5px;border-radius:3px;margin-top:2px}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.cal .dots i{width:7px;height:7px;border-radius:50%}
.cal .ws{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
.leg{display:flex;gap:10px;font-size:11px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:3px}
.log{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.log:first-child{border-top:0}
.ico{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.vals{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.banner{background:var(--warn2);border:1px solid #efd3b4;border-radius:12px;padding:11px 12px;margin:10px 0;font-size:14px}
.code{font-size:40px;font-weight:800;letter-spacing:6px;text-align:center;margin:6px 0}
.sync{font-size:12px;color:var(--mut)}
svg.ch{width:100%;height:auto;display:block}
.drill{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-top:8px}
.drill .pass{color:var(--acc);font-size:13px;margin-top:3px}
.drill .cue{color:var(--warn);font-size:13px;margin-top:3px}
.mrow{border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-top:8px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:#cfd3cd;margin:0 auto 10px}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
.hint{background:#f1f5fa;border:1px solid #d6e2f0;border-radius:11px;padding:9px 11px;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><h1>테니스 시즌</h1><span class="sync" id="sync"></span></header>
<main id="main"></main>
<nav>
<button data-a="tab" data-t="home">홈</button>
<button data-a="tab" data-t="cal">캘린더</button>
<button class="plus" data-a="rec"><span>+</span></button>
<button data-a="tab" data-t="fac">요소</button>
<button data-a="tab" data-t="log">기록</button>
</nav>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
'use strict';
/* 이 파일은 화면(엔진)만. 대회·요소·측정·드릴 내용은 저장소 데이터(훈련 프로그램)에서 온다. */
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ds(new Date());
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const DOW=['일','월','화','수','목','금','토'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const $=id=>document.getElementById(id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wd=d=>Math.floor(d/7)+'주 '+(d%7)+'일';
const WHO={solo:'혼자',one:'상대 1명과',partner:'복식 파트너와',four:'4명 (복식 상대 포함)'};
const SRC={sv:'SwingVision 무료',svpro:'SwingVision Pro',count:'직접 세기',timer:'스톱워치',other:'기타'};
const KIND={drill:{n:'드릴',c:'#2f7d4f',i:'드'},rally:{n:'랠리',c:'#3a6fb3',i:'랠'},game:{n:'게임',c:'#d08a1c',i:'게'},league:{n:'리그·대회',c:'#b33a3a',i:'리'}};
const ETYPE={league:'리그',tournament:'대회',event:'이벤트·클리닉',off:'못 치는 날',deadline:'마감'};
const DISCN={S:'단식',D:'복식',SD:'단식·복식','':'해당 없음'};
const DEF_SETTINGS={id:'main',planStart:'2026-11-23',level:{S:{cur:'NTRP 3.5 (자가)',goal:'4.0 상대와 대등'},D:{cur:'NTRP 3.5 (자가)',goal:'혼복 7.0~8.0 라인 50% 승'}}};
let SEED={events:[],factors:[],templates:[]};

/* ===== 데이터·동기화 ===== */
let db=loadCache(),outbox=JSON.parse(localStorage.getItem('ts3.outbox')||'[]'),net={state:'',authed:null};
function loadCache(){try{const c=JSON.parse(localStorage.getItem('ts3.cache'));if(c&&c.logs)return c}catch(e){}return {logs:[],factors:[],events:[],settings:[]}}
function saveCache(){localStorage.setItem('ts3.cache',JSON.stringify(db));localStorage.setItem('ts3.outbox',JSON.stringify(outbox))}
const useSeed=()=>!db.factors.length&&!db.events.length;
const EV=()=>(useSeed()?SEED.events:db.events).slice().sort((a,b)=>a.start<b.start?-1:1);
const FA=()=>(useSeed()?SEED.factors:db.factors).slice().sort((a,b)=>(a.order||99)-(b.order||99));
const AF=()=>FA().filter(f=>f.active!==false);
function ST(){const s=db.settings.find(x=>x.id==='main')||{};const o=JSON.parse(JSON.stringify(DEF_SETTINGS));return {...o,...s,level:{...o.level,...(s.level||{})}}}
function applyLocal(op){const arr=db[op.collection];for(const u of op.upserts||[]){const i=arr.findIndex(r=>r.id===u.id);if(i>=0)arr[i]={...arr[i],...u};else arr.push(u)}for(const id of op.deletes||[]){const i=arr.findIndex(r=>r.id===id);if(i>=0)arr.splice(i,1)}}
function queue(collection,rec){rec._u=new Date().toISOString();const op={collection,upserts:[rec]};applyLocal(op);outbox.push(op)}
function seedIfEmpty(){if(useSeed()&&SEED.factors.length){for(const e of SEED.events)queue('events',JSON.parse(JSON.stringify(e)));for(const f of SEED.factors)queue('factors',JSON.parse(JSON.stringify(f)))}}
function upsert(collection,rec){if(collection==='events'||collection==='factors')seedIfEmpty();queue(collection,rec);saveCache();safeRender();flush()}
function del(collection,id){if(collection==='events'||collection==='factors')seedIfEmpty();const op={collection,deletes:[id]};applyLocal(op);outbox.push(op);saveCache();safeRender();flush()}
let flushing=false;
async function flush(){if(flushing)return;flushing=true;
 try{while(outbox.length){const r=await fetch('/api/db',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(outbox[0])});
  if(r.status===401){net.authed=false;break}if(!r.ok){net.state='err';break}outbox.shift();saveCache();net.state='ok';net.authed=true}}catch(e){net.state='offline'}
 flushing=false;syncLabel()}
async function pull(){try{const r=await fetch('/api/db',{credentials:'same-origin'});
  if(r.status===401){net.authed=false;syncLabel();safeRender();return}if(!r.ok)throw 0;const d=await r.json();
  db={logs:d.logs||[],factors:d.factors||[],events:d.events||[],settings:d.settings||[]};outbox.forEach(applyLocal);saveCache();net.authed=true;net.state='ok';await flush()}catch(e){net.state='offline'}
 syncLabel();safeRender()}
function syncLabel(){const n=outbox.length;$('sync').textContent=net.authed===false?'기기 등록 필요':net.state==='offline'?(n?`오프라인 · ${n}개 대기`:'오프라인'):net.state==='err'?'저장 오류, 재시도 중':n?`저장 중 ${n}`:net.state==='ok'?'저장됨 ✓':''}
setInterval(()=>{if(outbox.length&&net.authed!==false)flush()},15000);addEventListener('online',flush);
let pendingRender=false;const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!$('sheet').contains(a)};
function safeRender(){if(typing()){pendingRender=true;syncLabel();return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render()}},60));
let pair=JSON.parse(localStorage.getItem('ts2.pair')||'null'),polling=false;
async function pairStart(){const r=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'start'})});if(!r.ok){alert('잠시 뒤 다시 해 주세요');return}pair=await r.json();localStorage.setItem('ts2.pair',JSON.stringify(pair));render();pairPoll()}
async function pairPoll(){if(polling||!pair)return;polling=true;
 for(let i=0;i<450&&pair;i++){try{const r=await fetch('/api/pair?nonce='+encodeURIComponent(pair.nonce),{credentials:'same-origin'});const j=await r.json();
  if(j.ok){pair=null;localStorage.removeItem('ts2.pair');polling=false;await pull();return}if(r.status===404){pair=null;localStorage.removeItem('ts2.pair');break}}catch(e){}await new Promise(r=>setTimeout(r,4000))}
 polling=false;safeRender()}

/* ===== 계획: A 대회에서 역산, 주 단위 회차 ===== */
const w0=()=>mon(ST().planStart);
const wkOf=d=>Math.floor(diffD(w0(),mon(d))/7)+1;
const wkStart=n=>addD(w0(),(n-1)*7);
const Aevents=()=>EV().filter(e=>e.pri==='A'&&(e.type==='league'||e.type==='tournament'));
const PH={base:{n:'기준 측정',c:'#7d838c',d:'SwingVision 켜고 평소처럼 치면 그 숫자가 기준이 돼요.'},build:{n:'기초 쌓기',c:'#2f7d4f',d:'목표 선에서 가장 먼 요소를 드릴로.'},retest:{n:'회복 · 재측정',c:'#7a5bb5',d:'양 줄이고, SV 켠 게임으로 다시 재기.'},sharp:{n:'시합형',c:'#c27c0e',d:'포인트 플레이와 패턴.'},taper:{n:'개막 주',c:'#3a7bb3',d:'가볍게, 감각만.'},season:{n:'시즌',c:'#b33a3a',d:'경기 1 + 약점 드릴 1 + 자유 1.'},'season-rt':{n:'시즌 · 재측정',c:'#8e3a6e',d:'이번 주 SV 켠 경기로 재측정.'},free:{n:'자유',c:'#8b939a',d:'A 대회가 없어요. 대회를 추가하면 계획이 생겨요.'}};
let _plan=null,_pk='';
function plan(){
 const key=JSON.stringify([EV(),ST().planStart,db.logs.length,db.factors.length]);if(_plan&&key===_pk)return _plan;
 const A=Aevents();
 const first=A.length?A.map(e=>e.start).sort()[0]:addD(ST().planStart,56),last=A.length?A.map(e=>e.end).sort().slice(-1)[0]:first;
 const fW=wkOf(first),lW=Math.max(wkOf(last),fW,4);const weeks=[];const W=weakName();
 for(let n=1;n<=lW&&n<120;n++){
  const i=n-1;let ph;if(!A.length)ph='free';else if(n===1)ph='base';else if(n>fW)ph='season';else if(n===fW)ph='taper';else if(n===fW-1)ph='sharp';else ph='build';
  if(A.length&&i>0&&i%4===0&&ph!=='taper')ph=ph==='season'?'season-rt':'retest';
  const start=wkStart(n),end=addD(start,6);const evs=EV().filter(e=>e.start<=end&&e.end>=start);
  let off=0;for(let d=0;d<7;d++){const x=addD(start,d);if(evs.some(e=>e.type==='off'&&e.start<=x&&e.end>=x))off++}
  const cnt=off>=5?1:off>=3?2:3;
  const S={base:['SV 켜고 랠리 30분+ (기준값)','SV 켜고 게임 또는 세트','자유: 드릴이나 랠리'],build:[`드릴: ${W}`,'드릴 또는 랠리 (SV 켜기)','게임 (SV 켜기)'],retest:['가볍게 랠리','SV 켜고 게임 (재측정)','자유'],sharp:['시합형: 첫 서브 한 번 게임 · 타이브레이크','복식 패턴: 포치 신호 · 첫 발리','게임 (SV 켜기)'],taper:['가볍게 감각','서브 20개 감각','개막 경기'],season:[`드릴: ${W}`,'랠리 또는 게임 (SV 켜기)','리그 경기'],'season-rt':[`드릴: ${W}`,'SV 켜고 게임 (재측정)','리그 경기'],free:['드릴','랠리','게임']}[ph].slice();
  const bc=evs.find(e=>(e.type==='tournament'||e.type==='event')&&e.pri!=='A');if(bc)S[2]=`${ETYPE[bc.type]}: ${bc.name}`;
  weeks.push({n,start,end,ph,todo:S.slice(0,cnt),cnt,evs,off});
 }
 _plan=weeks;_pk=key;return weeks}
const curWeek=()=>clamp(wkOf(today()),1,plan().length);
const logsWeek=n=>db.logs.filter(l=>wkOf(l.date)===n).sort((a,b)=>a.date<b.date?-1:1);
const hasVals=l=>l.vals&&Object.values(l.vals).some(v=>v!==''&&v!=null);
const nextA=()=>Aevents().filter(e=>e.end>=today())[0];
function discEvent(d){const A=Aevents().filter(e=>d==='SD'||e.disc===d||e.disc==='SD');return A[0]||Aevents()[0]}

/* ===== 목표·페이스 ===== */
const allMetrics=()=>AF().flatMap(f=>(f.metrics||[]).map(m=>({...m,f})));
function series(mid,kinds){const by={};for(const l of db.logs){if(kinds&&!kinds.includes(l.kind))continue;const v=l.vals&&l.vals[mid];if(v===''||v==null||isNaN(+v))continue;const w=wkOf(l.date);(by[w]=by[w]||[]).push(+v)}
 return Object.keys(by).map(Number).sort((a,b)=>a-b).map(w=>({w,v:Math.round(by[w].reduce((a,b)=>a+b,0)/by[w].length*10)/10}))}
function tgt(m){const s=series(m.id);if(!s.length)return null;const b=s[0].v;let t1,t2;
 if(m.unit==='%'&&+m.dir>0){t1=Math.min(95,b+5);t2=Math.min(97,b+10)}else if(+m.dir<0){const k=m.unit==='초';t1=Math.max(0,+(b-(k?.8:1)).toFixed(1));t2=Math.max(0,+(b-(k?1.5:2)).toFixed(1))}
 else if(m.unit==='mph'){t1=b+2;t2=b+4}else{t1=+(b*1.1).toFixed(1);t2=+(b*1.2).toFixed(1)}

 return h+`<button class="btn s" style="margin-top:8px" data-a="fadd" data-k="drills">+ 드릴</button><div class="row" style="margin-top:14px"><button class="btn p" style="flex:1" data-a="facSave">저장</button>${F._edit?'<button class="btn d" data-a="facDel">요소 삭제</button>':''}</div><div class="sub small" style="margin-top:6px">측정을 빼도 지난 기록 숫자는 남아요.</div>`}
function sDay(){const d=F.date,evs=EV().filter(e=>e.start<=d&&e.end>=d),L=db.logs.filter(l=>l.date===d);
 return `<div class="row sb"><h2 style="margin:0">${md(d)}(${DOW[pd(d).getDay()]}) · W${wkOf(d)}</h2><button class="btn s" data-a="close">닫기</button></div>${evs.map(e=>`<div class="log" data-a="evEdit" data-id="${e.id}"><div class="ico" style="background:${evColor(e)}">${evMark(e)}</div><div><b>${esc(e.name)}</b><div class="sub">${ETYPE[e.type]} · ${md(e.start)}~${md(e.end)}</div></div></div>`).join('')}${L.map(logRow).join('')}${!evs.length&&!L.length?'<div class="sub" style="margin:8px 0">비어 있어요.</div>':''}<div class="row" style="margin-top:10px"><button class="btn p" data-a="recDay" data-d="${d}">이 날 기록</button><button class="btn" data-a="evDay" data-d="${d}">이 날 대회·이벤트</button></div>`}
function sLv(){const st=ST();return `<div class="row sb"><h2 style="margin:0">수준</h2><button class="btn s" data-a="close">닫기</button></div>${['S','D'].map(d=>`<h3>${DISCN[d]}</h3><label class="f">현재<input type="text" data-f="level.${d}.cur" value="${esc(st.level[d].cur)}"></label><label class="f">목표<input type="text" data-f="level.${d}.goal" value="${esc(st.level[d].goal)}"></label>`).join('')}<button class="btn p w" style="margin-top:12px" data-a="lvSave">저장</button>`}
function newRec(extra){const wk=weakest();F={kind:'rally',date:today(),disc:'S',who:'one',focus:wk?[wk.id]:[],vals:{},pass:{},min:60,...extra};openSheet('rec')}

/* ===== 동작 ===== */
const act={
 tab:d=>{tab=d.t;render();scrollTo(0,0)},
 disc:d=>{disc=d.d;render()},
 rec:d=>{const h=d&&d.hint;let kind='rally',dsc='S';if(h){if(/드릴|시합형|패턴/.test(h))kind='drill';else if(/리그|개막/.test(h))kind='league';else if(/게임/.test(h))kind='game';if(/복식/.test(h))dsc='D'}newRec({hint:h||'',kind,disc:dsc})},
 recDay:d=>newRec({date:d.d}),
 logOpen:d=>{const l=db.logs.find(x=>x.id===d.id);if(!l)return;F={...JSON.parse(JSON.stringify(l)),_edit:true,who:'one'};openSheet('rec')},
 rf:d=>{grab();F[d.k]=d.v;drawSheet()},
 rfocus:d=>{grab();const a=F.focus=F.focus||[];const i=a.indexOf(d.id);if(i>=0)a.splice(i,1);else a.push(d.id);drawSheet()},
 rpass:d=>{grab();F.pass=F.pass||{};const p=F.pass[d.f]=F.pass[d.f]||{};const c=p[d.j];if(c===undefined)p[d.j]=true;else if(c===true)p[d.j]=false;else delete p[d.j];drawSheet()},
 recSave:()=>{grab();const r={...F};delete r._edit;delete r.hint;delete r.who;if(!r.id)r.id=uid('l');
  if(r.kind==='game'||r.kind==='league'){if(r.gw!==''&&r.gw!=null&&r.gl!==''&&r.gl!=null)r.res=+r.gw>+r.gl?'W':'L'}else{['gw','gl','res','score','evId'].forEach(k=>delete r[k])}
  if(r.kind!=='drill'){r.focus=[];r.pass={}}for(const k in r.vals||{})if(r.vals[k]==='')delete r.vals[k];hideSheet();upsert('logs',r)},
 recDel:()=>{if(!confirm('이 기록 지울까요?'))return;const id=F.id;hideSheet();del('logs',id)},
 evNew:()=>{F={type:'tournament',disc:'S',pri:'B',start:today(),end:today()};openSheet('ev')},
 evDay:d=>{F={type:'tournament',disc:'S',pri:'B',start:d.d,end:d.d};openSheet('ev')},
 evEdit:d=>{const e=EV().find(x=>x.id===d.id);if(!e)return;F={...e,_edit:true};openSheet('ev')},
 ef:d=>{grab();F[d.k]=d.v;drawSheet()},
 evSave:()=>{grab();if(!F.name||!F.start){alert('이름과 시작일을 넣어 주세요');return}const r={...F};delete r._edit;if(!r.end||r.end<r.start)r.end=r.start;if(!r.id)r.id=uid('e');if(r.type==='off'||r.type==='deadline')r.pri='C';hideSheet();upsert('events',r)},
 evDel:()=>{if(!confirm('지울까요?'))return;const id=F.id;hideSheet();del('events',id)},
 facGo:d=>{tab='fac';render();const el=$('fac-'+d.id);if(el)el.scrollIntoView({block:'start'})},
 facNew:()=>{F={};openSheet('fac')},
 facTpl:d=>{const t=JSON.parse(JSON.stringify(SEED.templates[+d.i]));F={name:t.name,disc:t.disc,why:'',active:true,metrics:t.metrics.map(m=>({...m,id:uid('m')})),drills:[],order:FA().length+1,_picked:true};drawSheet()},
 facEdit:d=>{const f=FA().find(x=>x.id===d.id);if(!f)return;F={...JSON.parse(JSON.stringify(f)),_edit:true};openSheet('fac')},
 ff:d=>{grab();F[d.k]=d.v;drawSheet()},
 fadd:d=>{grab();F[d.k]=F[d.k]||[];F[d.k].push(d.k==='metrics'?{id:uid('m'),name:'',unit:'%',dir:1,src:'sv',how:''}:{who:'one',name:'',how:'',pass:''});drawSheet()},
 fdel:d=>{grab();F[d.k].splice(+d.i,1);drawSheet()},
 facSave:()=>{grab();if(!F.name){alert('이름을 넣어 주세요');return}const r={...F};delete r._edit;delete r._picked;if(!r.id)r.id=uid('f');(r.metrics||[]).forEach(m=>{m.dir=+m.dir===-1?-1:1;if(!m.id)m.id=uid('m');['t1','t2'].forEach(k=>{if(m[k]==='')delete m[k]})});r.metrics=(r.metrics||[]).filter(m=>m.name);r.drills=(r.drills||[]).filter(x=>x.name);hideSheet();upsert('factors',r)},
 facDel:()=>{if(!confirm('이 요소를 지울까요? (기록 숫자는 남아요)'))return;const id=F.id;hideSheet();del('factors',id)},
 lvEdit:()=>{F={};openSheet('lv')},
 lvSave:()=>{grab();const st=ST();const s={...st,level:{S:{...st.level.S,...((F.level||{}).S||{})},D:{...st.level.D,...((F.level||{}).D||{})}}};hideSheet();upsert('settings',s)},
 day:d=>{F={date:d.d};openSheet('day')},
 calMode:d=>{calMode=d.v;render()},
 calNav:d=>{const[y,m]=calMonth.split('-').map(Number);calMonth=ds(new Date(y,m-1+ +d.v,1,12)).slice(0,7);render()},
 close:()=>{hideSheet();render()},
 pairStart:()=>pairStart()
};
document.addEventListener('click',e=>{if(e.target.id==='sheet'){hideSheet();render();return}const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const f=act[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.s==='planStart'&&el.value){const st=ST();st.planStart=el.value;upsert('settings',st)}});
fetch('/seed.json').then(r=>r.ok?r.json():null).then(s=>{if(s)SEED=s;render()}).catch(()=>{});
render();pull();if(pair)pairPoll();
</script>
