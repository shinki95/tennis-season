<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F7D4F">
<title>테니스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--g:#2F7D4F;--gl:#E6F2E9;--ink:#111318;--mut:#6B7280;--line:#E6E9EF;--bg:#F4F6F3;--r:#E5484D;--o:#E39A1B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px}
.w{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;justify-content:space-between;align-items:center}
.h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:12px}
.card{background:#fff;border-radius:22px;padding:16px;margin-top:12px}
.lbl{font-size:13px;font-weight:700;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}
.bar{height:8px;background:#EDF0EA;border-radius:9px;position:relative;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--g);border-radius:9px}
.btn{width:100%;border-radius:16px;padding:16px;font-size:18px;font-weight:800;background:var(--g);color:#fff;margin-top:12px}
.btn2{border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;background:#EEF1EC}
.seg{display:flex;background:#E9ECE7;border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:16px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid #C9CED8;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ck.y{background:var(--g);border-color:var(--g)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border-radius:14px;padding:14px 10px;font-size:16px;font-weight:700;background:#F1F3F0;text-align:center}
.opt.on{background:var(--ink);color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.it:first-child{border-top:0}
.it.y .t{color:#9CA3AF;text-decoration:line-through}
.it .s{display:block;font-size:13px;color:var(--mut)}
.now{background:var(--gl);border-radius:18px;padding:18px;margin-top:10px}
.now .t{font-size:24px;font-weight:800;line-height:1.2}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{flex:1;height:6px;border-radius:4px;background:#DCE3DA}.dots i.y{background:var(--g)}
.dt{position:relative;display:inline-flex;align-items:center;gap:4px;background:#F1F3F0;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.kr{padding:10px 0;border-top:1px solid var(--line)}.kr:first-child{border-top:0}
.wr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.wr:first-child{border-top:0}
.wd{width:58px;flex:none;font-weight:700;font-size:14px;color:var(--mut);text-align:left}
.pill{font-size:14px;font-weight:700;padding:5px 10px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g)}
.pill.done{background:var(--g);color:#fff;box-shadow:none}.pill.ev{box-shadow:none;background:#FDECEC;color:var(--r)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:9}
.nav button{flex:1;padding:10px 4px;font-size:15px;font-weight:700;color:var(--mut);border-radius:12px}
.nav button.on{color:var(--g);background:var(--gl)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;z-index:20}
.tl{position:relative;padding-left:22px;margin-top:8px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#E2E6DF}
.ms{position:relative;padding:6px 0 12px}
.ms .nd{position:absolute;left:-22px;top:9px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #C9CED8}
.ms.goal .nd{border-color:var(--g);background:var(--g)}.ms.next .nd{border-color:var(--ink)}.ms.ok .nd{border-color:var(--g)}.ms.miss .nd{border-color:var(--r)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.kv span{background:#F4F6F3;border-radius:9px;padding:5px 9px;font-size:13px}
.ti{width:52px;padding:3px 4px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;text-align:center}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.swipe{position:relative;margin-top:12px;border-radius:22px;overflow:hidden}
.swipe .swa{position:absolute;right:0;top:0;bottom:0;display:flex}
.swipe .swa button{width:76px;color:#fff;font-weight:800;font-size:14px}
.swipe .swf{position:relative;margin-top:0;transition:transform .2s;touch-action:pan-y}
.ib{width:36px;height:36px;border-radius:50%;background:#F1F3F0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:10px 13px;border-radius:12px;background:#F1F3F0;font-size:15px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.snack{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;font-weight:700;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px}
.snack button{color:#B9E4C6;font-weight:800;white-space:nowrap}
.krr{padding:10px 0;border-top:1px solid var(--line)}.krr:first-child{border-top:0}
</style>
</head>
<body>
<div id="app" class="w"></div>
<div id="toast"></div>
<div class="nav" id="nav"></div>
<script>
'use strict';
/* 흐름: 고르기(상대에 따라) → 카메라 켜고 확인 → 하나씩 (물 마실 때 다음) → 끝 → 영상 분석·회고·다음 훈련 → 목표.
   목표 KR 은 현장에서 셀 수 있는 '입력 지표'. 결과 지표(승·득실)는 따로. */
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+DOW[d.getDay()]};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const Q=new URLSearchParams(location.search);const TODAY=Q.get('d')||ds(new Date());
const TYPES=[['S','game','단식 게임'],['S','rally','단식 랠리'],['S','drill','단식 드릴'],['D','game','복식 게임'],['D','partner','복식 파트너 연습']];
const TN=(disc,kind)=>kind==='none'?'고르기 전':(TYPES.find(t=>t[0]===disc&&t[1]===kind)||[0,0,(disc==='D'?'복식 ':'단식 ')+kind])[2];
const KRT={sessions:{n:'훈련',u:'회'},factor:{n:'드릴',u:'회'},analyzed:{n:'영상 분석',u:'회'},retro:{n:'회고',u:'회'},doubles:{n:'복식',u:'회'},games:{n:'게임',u:'회'}};
const OKR_DEF=[
 {id:'o-S',disc:'S',v:3,title:'TLA 봄 단식 플레이오프 진출',start:'2026-11-23',end:'2027-03-14',lstart:'2027-01-19',krs:[{id:'f1',type:'factor',fid:'f-serve',target:65,per:2},{id:'f2',type:'factor',fid:'f-ground',target:75,per:1},{id:'f3',type:'factor',fid:'f-depth',target:50,per:1},{id:'f4',type:'factor',fid:'f-return',target:3,per:1}],res:[{type:'wins',target:3},{type:'gamepct',target:55}],ms:{}},
 {id:'o-D',disc:'D',v:3,title:'USTA 혼복 라인 승률 50%',start:'2026-11-23',end:'2027-04-04',lstart:'2027-01-09',krs:[{id:'f1',type:'factor',fid:'f-net',target:75,per:1},{id:'f2',type:'factor',fid:'f-return',target:3,per:1},{id:'f3',type:'factor',fid:'f-serve',target:65,per:1}],res:[{type:'winrate',target:50},{type:'gamepct',target:50}],ms:{}}];
let db={logs:[],factors:[],events:[],settings:[],todos:[],notes:[]};
let tab='today',day=TODAY,okEdit=false,toastT=null,gdisc='S',retroOpen=null;

async function load(){const me=await (await fetch('/api/auth?me=1')).json();if(!me.authed){document.getElementById('app').innerHTML=`<div style="padding-top:30vh"><div class="h1">테니스</div><button class="btn" onclick="location.href='/api/auth?start=1'">Google로 계속하기</button></div>`;return}
 db={...db,...(await (await fetch('/api/db')).json())};render()}
function save(c,rec){rec._u=new Date().toISOString();const arr=db[c];const i=arr.findIndex(r=>r.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec);render();return fetch('/api/db',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({collection:c,upserts:[rec]})})}
let UNDO=null;function snack(m,undo){clearTimeout(toastT);document.getElementById('toast').innerHTML=`<div class="snack"><span>${m}</span>${undo?'<button data-a="undo">실행 취소</button>':''}</div>`;toastT=setTimeout(()=>{document.getElementById('toast').innerHTML='';UNDO=null},5000)}
function undoable(m,c,id,fn){UNDO={c,id,prev:JSON.parse(JSON.stringify(db[c].find(r=>r.id===id)||null))};fn();snack(m,true)}
function toast(m){clearTimeout(toastT);document.getElementById('toast').innerHTML=`<div class="toast">${m}</div>`;toastT=setTimeout(()=>{document.getElementById('toast').innerHTML=''},2500)}

const ST=()=>db.settings.find(x=>x.id==='main')||{id:'main'};
const DAYS=()=>ST().days||[2,4,6];
const PS=()=>ST().planStart||'2026-11-23';
const wkOf=d=>Math.floor(diffD(mon(PS()),mon(d))/7)+1;
const wkStart=n=>addD(mon(PS()),(n-1)*7);
const FA=()=>db.factors.filter(f=>f.active!==false).sort((a,b)=>(a.order||99)-(b.order||99));
const EV=()=>db.events.filter(e=>e.type!=='off').sort((a,b)=>a.start<b.start?-1:1);
const OKR=()=>{const o=ST().okr;return o&&o.length&&o[0].v===3?o:OKR_DEF};
const lastW=()=>Math.max(...OKR().map(o=>wkOf(o.end)),8);

/* 회차 */
function weekSlots(n){if(n<1||n>lastW())return [];const ws=wkStart(n),we=addD(ws,6);
 const S=DAYS().map((dw,k)=>{const id=`W${n}-s${k+1}`,t=db.todos.find(x=>x.id===id)||{};return {...t,id,date:t.date||addD(ws,(dw+6)%7),disc:t.disc||'S',kind:t.kind||'game'}}).filter(s=>!s.hidden);
 db.todos.filter(t=>t.custom&&!t.hidden&&t.kind&&t.date>=ws&&t.date<=we).forEach(t=>S.push({...t,disc:t.disc||'S'}));
 S.forEach(s=>{if(!s.done&&db.logs.some(l=>l.todoId===s.id||(l.date===s.date&&l.src!=='quick')))s.done=true});return S}
function sessOn(d){const n=wkOf(d);const A=[n-1,n,n+1].flatMap(weekSlots).filter(s=>s.date===d);db.todos.filter(t=>t.custom&&!t.hidden&&t.kind&&t.date===d&&!A.some(x=>x.id===t.id)).forEach(t=>{const s={...t,disc:t.disc||'S'};if(!s.done&&db.logs.some(l=>l.todoId===s.id))s.done=true;A.push(s)});return A}
const allDone=(from,to)=>{const out=[];for(let n=Math.max(1,wkOf(from));n<=Math.min(lastW(),wkOf(to));n++)weekSlots(n).forEach(s=>{if(s.done&&s.date>=from&&s.date<=to)out.push(s)});return out};
const short=t=>{t=String(t||'');const c=t.split(/(?<=[.。])\s/)[0];return c.length>40?c.slice(0,39)+'…':c};
/* 할 것: Aside 가 넣은 items 우선, 없으면 기본 */
function itemsOf(s){if(s.kind==='none')return [];if(s.items&&s.items.length)return s.items;
 if(s.kind==='game')return [{k:'g',t:s.disc==='D'?'복식 게임':'단식 게임'}];
 if(s.kind==='rally')return [{k:'r1',t:'포핸드 크로스 랠리',fid:'f-ground'},{k:'r2',t:'백핸드 크로스 랠리',fid:'f-ground'},{k:'r3',t:'깊게 (서비스 라인 넘기기)',fid:'f-depth'},{k:'r4',t:'서브 · 리턴',fid:'f-serve'}];
 const who=s.kind==='partner'?['partner']:(s.disc==='D'?['four','partner']:['one','solo']);const fs=FA().filter(f=>s.disc==='D'?f.disc!=='S':f.disc!=='D');const out=[];
 for(const f of fs){for(const d of f.drills||[]){if(out.length<4&&!/^게임 중/.test(d.name)&&who.includes(d.who))out.push({k:'d'+out.length,t:d.name,s:short(d.desc||d.how),fid:f.id})}if(out.length>=4)break}
 return out}

/* 목표: 입력 지표 (셀 수 있는 것) */
function krCount(o,k,from,to){
 if(k.type==='sessions')return allDone(from,to).length+db.logs.filter(l=>!l.todoId&&l.date>=from&&l.date<=to&&!allDone(l.date,l.date).length).length;
 if(k.type==='doubles')return allDone(from,to).filter(s=>s.disc==='D').length;
 if(k.type==='games')return allDone(from,to).filter(s=>s.kind==='game').length;
 if(k.type==='factor')return allDone(from,to).filter(s=>itemsOf(s).some(x=>x.fid===k.fid&&(s.checks||{})[x.k])).length;
 if(k.type==='analyzed')return db.logs.filter(l=>l.date>=from&&l.date<=to&&((l.vals&&Object.keys(l.vals).length)||(l.drills&&l.drills.length))).length;
 if(k.type==='retro')return db.notes.filter(x=>x.type==='retro'&&x.date>=from&&x.date<=to).length;return 0}
const COL={'f-serve':'#2F6BFF','f-ground':'#2F7D4F','f-depth':'#8B5CF6','f-return':'#E39A1B','f-net':'#E5484D'};
const fName=fid=>((FA().find(f=>f.id===fid)||{}).name||'요소').replace(/ 안정| \(복식\)/,'');
const krName=k=>fName(k.fid);
function svSeries(fid){const f=FA().find(x=>x.id===fid);if(!f)return {name:'',pts:[]};const m=(f.metrics||[]).find(m=>m.src==='sv'&&m.unit==='%')||(f.metrics||[])[0];if(!m)return {name:'',pts:[]};const by={};db.logs.forEach(l=>{const v=(l.vals||{})[m.id];if(v!=null&&v!==''){const w=wkOf(l.date);(by[w]=by[w]||[]).push(+v)}});return {name:m.name,unit:m.unit,sv:m.src==='sv',pts:Object.keys(by).map(Number).sort((a,b)=>a-b).map(w=>[w,Math.round(by[w].reduce((a,b)=>a+b,0)/by[w].length)])}}
function spark(fid){const S=svSeries(fid),P=S.pts;if(!S.name)return '';const pre=S.sv?'SV ':'';if(P.length<1)return `<span class="mut sm">${pre}${esc(S.name)} 기록 없음</span>`;const last=P[P.length-1][1],first=P[0][1],dlt=last-first;
 let svg='';if(P.length>1){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-2,y1=Math.max(...ys)+2;svg=`<svg width="70" height="22" viewBox="0 0 70 22" style="display:inline-block;vertical-align:middle;width:70px"><polyline fill="none" stroke="${COL[fid]||'#2F7D4F'}" stroke-width="2" points="${P.map(p=>((p[0]-x0)/Math.max(1,x1-x0)*66+2)+','+(20-(p[1]-y0)/Math.max(1,y1-y0)*18)).join(' ')}"/></svg>`}
 return `<span class="mut sm">${pre}${esc(S.name)} <b style="color:var(--ink)">${last}${esc(S.unit||'')}</b>${P.length>1?` <span style="color:${dlt>=0?'var(--g)':'var(--r)'}">${dlt>=0?'▲':'▼'}${Math.abs(dlt)}</span>`:''}</span> ${svg}`}
const weeksBetween=(a,b)=>Math.max(0,(diffD(a,b)+1)/7);
function msDates(o){if(o.msd&&o.msd.length)return [...o.msd].sort().reverse();const out=[o.end];let d=addD(o.end,-28);while(d>addD(o.start,13)){out.push(d);d=addD(d,-28)}return out}
function msTarget(o,k,d){const ov=((o.ms||{})[d]||{})[k.id];if(ov!=null&&ov!=='')return +ov;const b=kBase(k)??(kDir(k)<0?k.target+2:k.target-10);const fr=clamp(diffD(o.start,d)/Math.max(1,diffD(o.start,o.end)),0,1);return Math.round((b+(k.target-b)*fr)*10)/10}
function msLabel(o,d){if(d===o.end)return '목표';if(d<o.lstart&&addD(d,28)>=o.lstart)return '개막 전';return `W${wkOf(d)} 점검`}
const nextMs=o=>msDates(o).filter(d=>d>=TODAY).sort()[0];
/* 결과 (참고, 영상 분석 뒤 Aside 가 넣는 기록에서) */
function resNow(o,r){const G=db.logs.filter(l=>l.disc===o.disc&&l.gw!=null&&l.gw!=='');const L=G.filter(l=>l.league&&l.date>=o.lstart);
 if(r.type==='wins')return {v:L.filter(l=>l.res==='W').length,u:'승',n:'리그 승'};if(r.type==='winrate')return {v:L.length?Math.round(L.filter(l=>l.res==='W').length/L.length*100):null,u:'%',n:'리그 승률'};
 const g=G.slice(-5),t=g.reduce((a,l)=>a+ +l.gw+ +l.gl,0);return {v:t?Math.round(g.reduce((a,l)=>a+ +l.gw,0)/t*100):null,u:'%',n:'게임 득실률'}}

/* 화면 */
function render(){document.getElementById('nav').innerHTML=[['today','오늘'],['plan','일정'],['goal','목표']].map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="tab" data-t="${k}">${n}</button>`).join('');document.getElementById('app').innerHTML=({today:vToday,plan:vPlan,goal:vGoal})[tab]()}
function dateBtn(id,date,kind){return `<label class="dt">${md(date)} ✎<input type="date" value="${date}" data-${kind}="${id}"></label>`}
function mOf(fid){const f=FA().find(x=>x.id===fid);if(!f)return null;return (f.metrics||[]).find(m=>m.src==='sv'&&m.unit==='%')||(f.metrics||[])[0]||null}
function kSeries(k){const m=mOf(k.fid);if(!m)return [];const by={};db.logs.forEach(l=>{const v=(l.vals||{})[m.id];if(v!=null&&v!==''){(by[l.date]=by[l.date]||[]).push(+v)}});return Object.keys(by).sort().map(d=>[d,Math.round(by[d].reduce((a,b)=>a+b,0)/by[d].length*10)/10])}
const kDir=k=>{const m=mOf(k.fid);return m&&+m.dir<0?-1:1};
const kUnit=k=>{const m=mOf(k.fid);return m?m.unit:''};
const kMetric=k=>{const m=mOf(k.fid);return m?m.name:''};
function kNow(k){const S=kSeries(k);return S.length?S[S.length-1][1]:null}
function kBase(k){const S=kSeries(k);return S.length?S[0][1]:null}
function kProg(k){const b=kBase(k),c=kNow(k),t=k.target;if(b==null||c==null)return null;if(t===b)return c*kDir(k)>=t*kDir(k)?1:0;return clamp((c-b)/(t-b),0,1)}
function trend(pts,target,color,dir,W,H){W=W||110;H=H||34;if(!pts.length)return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:${W}px;opacity:.35"><line x1="2" x2="${W-2}" y1="${H/2}" y2="${H/2}" stroke="#C9CED8" stroke-dasharray="3 3"/></svg>`;
 const ys=[...pts.map(p=>p[1]),target],y0=Math.min(...ys)-2,y1=Math.max(...ys)+2,n=pts.length,X=i=>n<2?W/2:4+i/(n-1)*(W-8),Y=v=>H-3-(v-y0)/Math.max(1,y1-y0)*(H-6);
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:${W}px;display:inline-block;vertical-align:middle"><line x1="2" x2="${W-2}" y1="${Y(target)}" y2="${Y(target)}" stroke="${color}" stroke-dasharray="4 3" opacity=".6"/>${n>1?`<polyline fill="none" stroke="${color}" stroke-width="2.4" points="${pts.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>`:''}<circle cx="${X(n-1)}" cy="${Y(pts[n-1][1])}" r="3.5" fill="${color}"/></svg>`}
function gameSeries(o){return db.logs.filter(l=>l.disc===o.disc&&l.gw!=null&&l.gw!==''&&(+l.gw+ +l.gl)>0).sort((a,b)=>a.date<b.date?-1:1).map(l=>[l.date,Math.round(+l.gw/(+l.gw+ +l.gl)*100)])}
function krRow(o,k,big){const c=COL[k.fid]||'#2F7D4F',now=kNow(k),base=kBase(k),u=kUnit(k),ws=mon(day),we=addD(ws,6),tr=krCount(o,k,ws,we);
 if(!big)return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line);gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:${c};flex:none"></i><b style="width:58px;flex:none">${esc(krName(k))}</b><span style="flex:1;font-size:14px">${now==null?'<span class="mut">–</span>':`<b>${now}</b>`}<span class="mut">/${kDir(k)<0?'≤':''}${k.target}${esc(u)}</span></span>${trend(kSeries(k),k.target,c,kDir(k),64,24)}<span class="mut sm" style="width:46px;text-align:right">훈련 <b style="color:${tr>=k.per?'var(--g)':'var(--ink)'}">${tr}/${k.per}</b></span></div>`;
 return `<div class="krr"><div class="row sb"><span class="row" style="gap:6px"><i style="width:9px;height:9px;border-radius:50%;background:${c};display:inline-block"></i><b>${esc(krName(k))}</b><span class="mut sm">${esc(kMetric(k))}</span></span><span class="mut sm">이번 주 훈련 <b style="color:${tr>=k.per?'var(--g)':'var(--ink)'}">${tr}/${k.per}</b></span></div><div style="font-size:15px;margin-top:2px">${now==null?'<span class="mut">기록 전</span>':`<b>${base!=null&&base!==now?base+' → ':''}${now}</b>`} <span class="mut">/ 목표 ${kDir(k)<0?'≤ ':''}${k.target}${esc(u)}</span></div><div style="margin-top:6px">${trend(kSeries(k),k.target,c,kDir(k),330,80)}</div></div>`}
function resRow(o,r){const x=resNow(o,r),pts=r.type==='gamepct'?gameSeries(o):[];return `<div class="krr"><div class="row sb"><b>${x.n}</b>${pts.length?trend(pts,r.target,'#111318',1):''}</div><div style="font-size:15px;margin-top:2px">${x.v==null?'<span class="mut">기록 전</span>':`<b>${x.v}${x.u}</b>`} <span class="mut">/ 목표 ${r.target}${x.u}</span></div></div>`}
function goalCard(){return `<div class="card">${OKR().map((o,i)=>{const nx=nextMs(o);return `<div style="${i?'margin-top:16px':''}"><button class="row sb" style="width:100%;text-align:left" data-a="tab" data-t="goal" data-d="${o.disc}"><b style="font-size:17px">${esc(o.title)}</b><span class="mut sm">${o.disc==='D'?'복식':'단식'} ›</span></button>${nx?`<div class="mut sm">다음 단계 ${md(nx)} · ${msLabel(o,nx)}</div>`:''}<div style="margin-top:4px">${o.krs.map(k=>krRow(o,k)).join('')}<div class="mut sm" style="padding-top:8px;border-top:1px solid var(--line)">결과 · ${(o.res||[]).map(r=>{const x=resNow(o,r);return `${x.n} <b style="color:var(--ink)">${x.v==null?'–':x.v}</b>/${r.target}${x.u}`}).join(' · ')}</div></div></div>`}).join('')}</div>`}
function typeChips(id,s){return `<div class="chips">${TYPES.map(([d,k,n])=>`<button class="chip ${s&&s.disc===d&&s.kind===k?'on':''}" data-a="${id?'sType':'sNew'}" data-id="${id||''}" data-d="${d}" data-k="${k}">${n}</button>`).join('')}</div>`}
function sessCard(s){const it=itemsOf(s),ck=s.checks||{},step=s.done?'done':s.step||'ready',cur=it.findIndex(x=>!ck[x.k]);
 let h=`<div class="swipe" data-id="${s.id}"><div class="swa"><button style="background:var(--o)" data-a="sTomorrow" data-id="${s.id}">내일로</button><button style="background:var(--mut)" data-a="sRest" data-id="${s.id}">쉬기</button></div><div class="swf card">`;
 if(step==='ready'){h+=`<div class="row sb"><span class="lbl">시작 전</span><span class="row" style="gap:6px">${dateBtn(s.id,s.date,'mv')}<button class="ib" aria-label="더보기 (쉬기·내일로)" data-a="swOpen" data-id="${s.id}">⋯</button></span></div>${typeChips(s.id,s)}
  <div style="margin-top:12px">${it.map(x=>`<div class="it"><span class="ck" style="width:22px;height:22px;border-style:dashed"></span><span><span class="t">${esc(x.t)}</span>${x.s?`<span class="s">${esc(x.s)}</span>`:''}</span></div>`).join('')}</div><button class="btn" data-a="sStart" data-id="${s.id}">카메라 켜고 시작</button>`}
 else if(step==='go'){const x=it[cur];h+=`<div class="row sb"><span class="lbl">하는 중 · ● 촬영</span><button class="ib" aria-label="중단" data-a="sCancel" data-id="${s.id}">✕</button></div><b style="font-size:20px">${TN(s.disc,s.kind)}</b><div class="dots">${it.map(y=>`<i class="${ck[y.k]?'y':''}"></i>`).join('')}</div>
  ${x?`<div class="now"><div class="mut sm">${cur+1} / ${it.length}</div><div class="t">${esc(x.t)}</div>${x.s?`<div class="mut" style="margin-top:4px">${esc(x.s)}</div>`:''}</div><button class="btn" data-a="iNext" data-id="${s.id}" data-k="${x.k}">${cur===it.length-1?'완료':'다음 →'}</button>`:`<button class="btn" data-a="sEnd" data-id="${s.id}">완료</button>`}
  <div style="margin-top:10px">${it.map((y,i)=>`<button class="it ${ck[y.k]?'y':''}" data-a="iCk" data-id="${s.id}" data-k="${y.k}"><span class="ck ${ck[y.k]?'y':''}" style="width:22px;height:22px;font-size:12px">${ck[y.k]?'✓':''}</span><span class="t" style="${i===cur?'font-weight:800':''}">${esc(y.t)}</span></button>`).join('')}</div>${x?`<button class="mut" style="width:100%;margin-top:10px;font-weight:700" data-a="sEnd" data-id="${s.id}">여기까지 하고 끝내기</button>`:''}`}
 else{const lg=db.logs.find(l=>l.date===s.date&&l.src!=='quick'),nt=db.notes.find(n=>n.id==='R-'+s.id),nx=(()=>{for(let i=1;i<15;i++){const x=addD(s.date,i);const S=sessOn(x).filter(z=>!z.done);if(S.length)return S[0]}return null})();
  const P=[['up','SwingVision 캡처 Slack에',!!(s.post||{}).up||!!lg],['ana','SV 숫자 반영 (Aside)',!!(lg&&lg.vals&&Object.keys(lg.vals).length)],['retro','회고',!!nt],['next','다음 훈련 받기',!!(nx&&nx.items&&nx.items.length)]];
  h+=`<div class="row"><button class="ck y" aria-label="완료 해제" data-a="sReopen" data-id="${s.id}">✓</button><b style="font-size:20px">${TN(s.disc,s.kind)}</b><span class="lbl" style="margin-left:auto">끝남</span></div><div style="margin-top:10px">${P.map(([k,t,on])=>`<button class="it ${on?'y':''}" data-a="${k==='retro'?'retroT':k==='up'?'postT':'noop'}" data-id="${s.id}" data-k="${k}"><span class="ck ${on?'y':''}" style="width:22px;height:22px;font-size:12px">${on?'✓':''}</span><span class="t">${t}</span></button>`).join('')}</div>
  ${retroOpen===s.id?`<textarea class="inp" id="rt" rows="3" placeholder="잘된 것 / 다음엔">${esc(nt?nt.text:'')}</textarea><button class="btn2" style="margin-top:8px" data-a="retroSave" data-id="${s.id}">저장</button>`:''}`}
 return h+'</div></div>'}
function vToday(){const isT=day===TODAY;let h=`<div class="top"><button class="ib" aria-label="전날" data-a="dNav" data-v="-1">‹</button><div style="text-align:center"><label style="position:relative;display:inline-block"><div class="h1">${isT?'오늘':md(day)} <span style="font-size:16px;color:var(--mut)">▾</span></div><input type="date" value="${day}" data-day="1" style="position:absolute;inset:0;opacity:0;width:100%"></label>${isT?`<div class="mut sm">${md(day)}</div>`:`<button class="sm" data-a="dToday" style="color:var(--g);font-weight:700">오늘로</button>`}</div><button class="ib" aria-label="다음날" data-a="dNav" data-v="1">›</button></div>`+goalCard();
 const S=sessOn(day),evs=EV().filter(e=>e.start<=day&&e.end>=day);evs.forEach(e=>{h+=`<div class="card" style="background:#FDECEC;color:var(--r);font-weight:800">${esc(e.name)}</div>`});
 S.forEach(s=>{h+=sessCard(s)});
 h+=`<div class="card"><div class="lbl">${S.length?'하나 더 추가':'훈련 추가'}</div>${typeChips(null,null)}</div>`;return h}
function vPlan(){const cw=Math.max(1,wkOf(TODAY));let h=`<div class="top"><div class="h1">일정</div></div><div class="card"><div class="lbl">대회</div>${EV().filter(e=>e.end>=addD(TODAY,-30)).map(e=>`<div class="row sb" style="padding:8px 0;border-top:1px solid var(--line)"><span style="min-width:0">${esc(e.name)}<div class="mut sm">D-${Math.max(0,diffD(TODAY,e.start))}</div></span>${dateBtn(e.id,e.start,'ev')}</div>`).join('')}</div>`;
 for(let n=Math.max(1,cw-2);n<=Math.min(lastW(),cw+6);n++){const ws=wkStart(n);h+=`<div class="card" ${n===cw?'id="cur"':''}><div class="row sb"><div class="lbl">${n===cw?'이번 주 · ':''}W${n}</div><span class="mut sm">${md(ws)}~</span></div>`;
  for(let k=0;k<7;k++){const d=addD(ws,k),S=sessOn(d),E=EV().filter(e=>e.start===d);if(!S.length&&!E.length)continue;h+=`<div class="wr"><button class="wd" data-a="go" data-d="${d}">${DOW[pd(d).getDay()]} ${pd(d).getDate()}</button><div class="row" style="flex-wrap:wrap;gap:6px;flex:1">${E.map(e=>`<span class="pill ev">${esc(e.name)}</span>`).join('')}${S.map(s=>`<span class="pill ${s.done?'done':''}">${TN(s.disc,s.kind)}</span>`).join('')}</div>${S[0]?dateBtn(S[0].id,S[0].date,'mv'):''}</div>`}
  h+=`</div>`}return h}
function wkVal(k,n){const m=mOf(k.fid);if(!m)return null;const ws=wkStart(n),we=addD(ws,6);const v=db.logs.filter(l=>l.date>=ws&&l.date<=we).map(l=>(l.vals||{})[m.id]).filter(v=>v!=null&&v!=='').map(Number);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null}
function weekTable(o){const cw=Math.max(1,wkOf(TODAY)),last=Math.min(wkOf(o.end),cw+2),ks=o.krs;let h=`<div class="card"><div class="lbl">주차별 · 실제 / 그 주 목표</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:13px"><tr><th style="text-align:left;padding:6px 4px;color:var(--mut)">주</th>${ks.map(k=>`<th style="padding:6px 4px;color:${COL[k.fid]};text-align:center">${esc(krName(k))}</th>`).join('')}</tr>`;
 for(let n=last;n>=1;n--){const we=addD(wkStart(n),6);h+=`<tr style="border-top:1px solid var(--line);${n===cw?'background:#F4F6F3':''}"><td style="padding:7px 4px;white-space:nowrap"><b>W${n}</b><div class="mut" style="font-size:11px">${md(wkStart(n)).replace(/ .+/,'')}~</div></td>${ks.map(k=>{const v=wkVal(k,n),t=msTarget(o,k,we),tr=krCount(o,k,wkStart(n),we);const ok=v==null?null:(kDir(k)<0?v<=t:v>=t);
   return `<td style="text-align:center;padding:7px 4px"><b style="color:${ok==null?'#C4C9D2':ok?'var(--g)':'var(--r)'}">${v==null?'–':v}</b><span class="mut" style="font-size:11px">/${t}</span><div class="mut" style="font-size:11px">훈련 ${tr}</div></td>`}).join('')}</tr>`}
 return h+`</table></div><div class="mut sm" style="margin-top:6px">초록 = 그 주 목표 넘음 · 빨강 = 못 미침 · 숫자는 SwingVision</div></div>`}
function vGoal(){const o=OKR().find(x=>x.disc===gdisc),E=okEdit,ws=mon(TODAY),we=addD(ws,6),nx=nextMs(o);
 let h=`<div class="top"><div class="h1">목표</div><button class="btn2" data-a="okEdit">${E?'완료':'조정'}</button></div><div class="seg">${['S','D'].map(k=>`<button class="${gdisc===k?'on':''}" data-a="gDisc" data-v="${k}">${k==='S'?'단식':'복식'}</button>`).join('')}</div>`;
 h+=`<div class="card">${E?`<input class="inp" style="font-weight:800;font-size:18px" data-ot="${o.id}" value="${esc(o.title)}"><div class="row mut sm" style="margin-top:8px">${dateBtn(o.id,o.start,'os')} ~ ${dateBtn(o.id,o.end,'oe')}</div>`:`<div style="font-size:20px;font-weight:800">${esc(o.title)}</div><div class="mut sm">${md(o.start)} ~ ${md(o.end)}</div>`}
  <div class="lbl" style="margin-top:14px">KR · 요소별 목표값과 추이</div>${o.krs.map(k=>E?`<div class="krr"><div class="row sb"><b>${esc(krName(k))}</b><span class="mut sm">${esc(kMetric(k))}</span></div><div class="row sm" style="margin-top:6px;gap:8px">목표 <input class="ti" data-kt="${o.id}:${k.id}" value="${k.target}">${esc(kUnit(k))} · 주 훈련 <input class="ti" data-kp="${o.id}:${k.id}" value="${k.per}">회</div></div>`:krRow(o,k,true)).join('')}${(o.res||[]).map(r=>resRow(o,r)).join('')}</div>`;
 h+=weekTable(o);
 const D=msDates(o);h+=`<div class="card"><div class="lbl">단계 (목표에서 거꾸로)</div><div class="tl">${D.map(d=>{const past=d<TODAY;const ok=past?o.krs.every(k=>{const S=kSeries(k).filter(p=>p[0]<=d);if(!S.length)return true;const v=S[S.length-1][1];return kDir(k)<0?v<=msTarget(o,k,d):v>=msTarget(o,k,d)}):null;
  return `<div class="ms ${d===o.end?'goal':d===nx?'next':past?(ok?'ok':'miss'):''}"><span class="nd"></span><div class="row sb"><b>${msLabel(o,d)}</b>${E&&d!==o.end?dateBtn(o.id+'|'+d,d,'md'):`<span class="mut">${md(d)}${d===nx?' · 다음':''}</span>`}</div><div class="kv">${o.krs.map(k=>`<span>${esc(krName(k))} ${E?`<input class="ti" data-mv="${o.id}|${d}|${k.id}" value="${msTarget(o,k,d)}">`:`<b>${msTarget(o,k,d)}</b>`}${esc(kUnit(k))}</span>`).join('')}</div></div>`}).join('')}</div></div>`;
 h+=``;
 return h}

 postT:d=>{const s=findS(d.id);todoPut(d.id,{post:{...(s.post||{}),up:!(s.post||{}).up}})},

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||['INPUT','TEXTAREA'].includes(b.tagName))return;const f=act[b.dataset.a];if(f){e.preventDefault();f(b.dataset)}});

 else if(x.os&&v)okrSave(L=>{L.find(o=>o.id===x.os).start=v});
 else if(x.oe&&v)okrSave(L=>{L.find(o=>o.id===x.oe).end=v});
 else if(x.kt){const[oid,kid]=x.kt.split(':');okrSave(L=>{L.find(o=>o.id===oid).krs.find(k=>k.id===kid).target=+v})}
 else if(x.kp){const[oid,kid]=x.kp.split(':');okrSave(L=>{L.find(o=>o.id===oid).krs.find(k=>k.id===kid).per=+v})}
 else if(x.md&&v){const[oid,d]=x.md.split('|');okrSave(L=>{const o=L.find(o=>o.id===oid);o.msd=[...msDates(o).filter(z=>z!==d),v];if(o.ms&&o.ms[d]){o.ms[v]=o.ms[d];delete o.ms[d]}})}});
let sw=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest('.swipe');if(!el||e.target.closest('input,button.chip'))return;sw={el,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(sw.lock==null)sw.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';if(sw.lock!=='x')return;const base=sw.el.classList.contains('open')?-152:0;sw.dx=clamp(base+dx,-170,0);sw.el.querySelector('.swf').style.transform=`translateX(${sw.dx}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;if(sw.lock==='x'){const open=sw.dx<-70;sw.el.classList.toggle('open',open);sw.el.querySelector('.swf').style.transform=open?'translateX(-152px)':''}sw=null});
load();
</script>
