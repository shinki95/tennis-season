<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F7D4F">
<title>테니스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--g:#2F7D4F;--gl:#E6F2E9;--ink:#111318;--mut:#6B7280;--line:#E6E9EF;--bg:#F4F6F3;--r:#E5484D;--o:#E39A1B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
.w{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;justify-content:space-between;align-items:center}
.h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:12px}
.card{background:#fff;border-radius:22px;padding:16px;margin-top:12px}
.lbl{font-size:13px;font-weight:700;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}
.bar{height:8px;background:#EDF0EA;border-radius:9px;position:relative;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--g);border-radius:9px}
.btn2{border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;background:#EEF1EC}
.seg{display:flex;background:#E9ECE7;border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:16px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid #C9CED8;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ck.y{background:var(--g);border-color:var(--g)}
.ses{padding:6px 0 4px}
.ses+.ses{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.st{font-size:21px;font-weight:800;flex:1}
.dt{position:relative;display:inline-flex;align-items:center;gap:4px;background:#F1F3F0;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink)}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.it:first-child{border-top:0}
.it.y .t{color:#9CA3AF;text-decoration:line-through}
.it .s{display:block;font-size:13px;color:var(--mut)}
.wk{margin-top:6px}
.wr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wd{width:58px;flex:none;font-weight:700;font-size:14px;color:var(--mut)}
.pill{font-size:14px;font-weight:700;padding:5px 10px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g)}
.pill.done{background:var(--g);color:#fff;box-shadow:none}
.pill.ev{box-shadow:none;background:#FDECEC;color:var(--r)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:9}
.nav button{flex:1;padding:10px 4px;font-size:15px;font-weight:700;color:var(--mut);border-radius:12px}
.nav button.on{color:var(--g);background:var(--gl)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;z-index:20}
.tl{position:relative;padding-left:22px;margin-top:8px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#E2E6DF}
.ms{position:relative;padding:6px 0 12px}
.ms .nd{position:absolute;left:-22px;top:9px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #C9CED8}
.ms.goal .nd{border-color:var(--g);background:var(--g)}.ms.next .nd{border-color:var(--ink)}.ms.ok .nd{border-color:var(--g)}.ms.miss .nd{border-color:var(--r)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kv span{background:#F4F6F3;border-radius:9px;padding:5px 9px;font-size:13px}
.kv input,.ti{width:56px;padding:3px 4px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;text-align:center}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
</style>
</head>
<body>
<div id="app" class="w"></div>
<div id="toast"></div>
<div class="nav" id="nav"></div>
<script>
'use strict';
/* 보여주기만: 목표와 할 것. 숫자 기록은 영상 → Slack → Aside. 날짜는 모두 바꿀 수 있음. */
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+DOW[d.getDay()]};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const r1=v=>Math.round(v*10)/10;
const Q=new URLSearchParams(location.search);const TODAY=Q.get('d')||ds(new Date());
const KN={game:'게임',drill:'드릴'};const DN={S:'단식',D:'복식'};
const KRT={wins:{n:'리그 승',u:'승'},winrate:{n:'리그 승률',u:'%'},gamepct:{n:'게임 득실률',u:'%'},factor:{n:'향상',u:'%p'},freq:{n:'주 평균',u:'회'},count:{n:'이번 달 연습',u:'회'}};
const OKR_DEF=[
 {id:'o-S',disc:'S',title:'TLA 봄 단식 플레이오프 진출',start:'2026-11-23',end:'2027-03-14',lstart:'2027-01-19',krs:[{id:'k1',type:'wins',target:3},{id:'k2',type:'gamepct',target:55},{id:'k3',type:'factor',fid:'f-serve',target:5},{id:'k4',type:'freq',target:2.5}],ms:{}},
 {id:'o-D',disc:'D',title:'USTA 혼복 라인 승률 50%',start:'2026-11-23',end:'2027-04-04',lstart:'2027-01-09',krs:[{id:'k1',type:'winrate',target:50},{id:'k2',type:'gamepct',target:50},{id:'k3',type:'factor',fid:'f-net',target:10},{id:'k4',type:'count',target:4}],ms:{}}];
let db={logs:[],factors:[],events:[],settings:[],todos:[],notes:[]};
let tab='today',day=TODAY,okEdit=false,toastT=null,gdisc='S';

async function load(){const me=await (await fetch('/api/auth?me=1')).json();if(!me.authed){document.getElementById('app').innerHTML=`<div style="padding-top:30vh"><div class="h1">테니스</div><button class="btn2" style="width:100%;margin-top:14px;padding:15px;background:var(--g);color:#fff" onclick="location.href='/api/auth?start=1'">Google로 계속하기</button></div>`;return}
 db={...db,...(await (await fetch('/api/db')).json())};render()}
function save(c,rec){rec._u=new Date().toISOString();const arr=db[c];const i=arr.findIndex(r=>r.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec);render();return fetch('/api/db',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({collection:c,upserts:[rec]})})}
function toast(m){clearTimeout(toastT);document.getElementById('toast').innerHTML=`<div class="toast">${m}</div>`;toastT=setTimeout(()=>{document.getElementById('toast').innerHTML=''},2500)}

const ST=()=>db.settings.find(x=>x.id==='main')||{id:'main'};
const DAYS=()=>ST().days||[2,4,6];
const PS=()=>ST().planStart||'2026-11-23';
const wkOf=d=>Math.floor(diffD(mon(PS()),mon(d))/7)+1;
const wkStart=n=>addD(mon(PS()),(n-1)*7);
const FA=()=>db.factors.filter(f=>f.active!==false).sort((a,b)=>(a.order||99)-(b.order||99));
const EV=()=>db.events.filter(e=>e.type!=='off').sort((a,b)=>a.start<b.start?-1:1);
const OKR=()=>(ST().okr&&ST().okr.length?ST().okr:OKR_DEF);
const lastW=()=>Math.max(...OKR().map(o=>wkOf(o.end)),8);

/* 일정: 기본 요일 회차 + 직접 추가한 것. 같은 날 기록(영상 분석 결과)이 있으면 완료 */
function weekSlots(n){if(n<1||n>lastW())return [];const ws=wkStart(n),we=addD(ws,6);
 const S=DAYS().map((dw,k)=>{const id=`W${n}-s${k+1}`,t=db.todos.find(x=>x.id===id)||{};return {...t,id,date:t.date||addD(ws,(dw+6)%7),disc:t.disc||'S',kind:t.kind==='drill'?'drill':'game'}}).filter(s=>!s.hidden);
 db.todos.filter(t=>t.custom&&!t.hidden&&t.kind&&t.date>=ws&&t.date<=we).forEach(t=>S.push({...t,disc:t.disc||'S',kind:t.kind==='drill'?'drill':'game'}));
 S.forEach(s=>{if(!s.done&&db.logs.some(l=>l.todoId===s.id||l.date===s.date))s.done=true});return S}
function sessOn(d){const n=wkOf(d);return [n-1,n,n+1].flatMap(weekSlots).filter(s=>s.date===d)}
const short=t=>{t=String(t||'');const c=t.split(/(?<=[.。])\s/)[0];return c.length>40?c.slice(0,39)+'…':c};
/* 할 것: Aside 가 Slack 대화 뒤 넣은 items 가 있으면 그것, 없으면 기본 */
function weakFid(disc){return (FA().find(f=>disc==='D'?f.disc!=='S':f.disc!=='D')||{}).id}
function itemsOf(s){if(s.items&&s.items.length)return s.items;
 if(s.kind==='game')return [{k:'wu',t:'워밍업 10분'},{k:'g',t:'게임',s:'SV 켜고 촬영'}];
 const f=FA().find(x=>x.id===weakFid(s.disc));const L=(f?f.drills||[]:[]).filter(d=>!/^게임 중/.test(d.name)&&(s.disc==='D'?d.who!=='one':d.who!=='partner'&&d.who!=='four')).slice(0,3);
 return [{k:'wu',t:'워밍업 10분'},...L.map((d,i)=>({k:'d'+i,t:d.name,s:short(d.desc||d.how)}))]}

/* 목표 계산 (기록은 Aside 가 영상 분석으로 넣음) */
const games=(disc,until,league)=>db.logs.filter(l=>l.disc===disc&&l.date<=until&&l.gw!=null&&l.gw!==''&&(!league||l.league));
function fSer(fid,until){const f=FA().find(x=>x.id===fid);if(!f)return [];const by={};for(const l of db.logs){if(l.date>until)continue;const w=wkOf(l.date);(l.drills||[]).forEach(x=>{if(x.fid===fid&&x.att>0&&x.made!=null&&x.made!=='')(by[w]=by[w]||[]).push(x.made/x.att*100)});(f.metrics||[]).forEach(m=>{const v=(l.vals||{})[m.id];if(m.unit==='%'&&v!=null&&v!=='')(by[w]=by[w]||[]).push(+v)})}return Object.keys(by).sort((a,b)=>a-b).map(w=>by[w].reduce((a,b)=>a+b,0)/by[w].length)}
function krNow(o,k,until){until=until||TODAY;
 if(k.type==='wins')return games(o.disc,until,true).filter(l=>l.date>=o.lstart&&l.res==='W').length;
 if(k.type==='winrate'){const G=games(o.disc,until,true).filter(l=>l.date>=o.lstart);return G.length?Math.round(G.filter(l=>l.res==='W').length/G.length*100):null}
 if(k.type==='gamepct'){const G=games(o.disc,until).slice(-5);const t=G.reduce((a,l)=>a+ +l.gw+ +l.gl,0);return t?Math.round(G.reduce((a,l)=>a+ +l.gw,0)/t*100):null}
 if(k.type==='factor'){const s=fSer(k.fid,until);return s.length<2?null:r1(s[s.length-1]-s[0])}
 if(k.type==='freq'){const wk=Math.max(1,Math.ceil((diffD(o.start,until)+1)/7));return r1(db.logs.filter(l=>l.date>=o.start&&l.date<=until).length/wk)}
 if(k.type==='count')return db.logs.filter(l=>l.disc===o.disc&&l.date.slice(0,7)===until.slice(0,7)).length;return null}
const krName=k=>k.type==='factor'?((FA().find(f=>f.id===k.fid)||{}).name||'요소')+' 향상':KRT[k.type].n;
const krP=(k,v)=>v==null?null:clamp(v/(k.target||1),0,1);
function msDates(o){if(o.msd&&o.msd.length)return [...o.msd].sort().reverse();const out=[o.end];let d=addD(o.end,-28);while(d>addD(o.start,13)){out.push(d);d=addD(d,-28)}return out}
function msVal(o,k,d){const ov=((o.ms||{})[d]||{})[k.id];if(ov!=null&&ov!=='')return +ov;const fr=clamp(diffD(o.start,d)/Math.max(1,diffD(o.start,o.end)),0,1);
 if(k.type==='wins')return d<o.lstart?null:Math.round(k.target*clamp(diffD(o.lstart,d)/Math.max(1,diffD(o.lstart,o.end)),0,1));
 if(k.type==='winrate')return d<o.lstart?null:k.target;if(k.type==='gamepct')return Math.round(45+(k.target-45)*fr);if(k.type==='factor')return r1(k.target*fr);return k.target}
function msLabel(o,d){if(d===o.end)return '목표';if(d<o.lstart&&addD(d,28)>=o.lstart)return '개막 전';return `W${wkOf(d)} 점검`}

/* 화면 */
function render(){document.getElementById('nav').innerHTML=[['today','오늘'],['plan','일정'],['goal','목표']].map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="tab" data-t="${k}">${n}</button>`).join('');document.getElementById('app').innerHTML=({today:vToday,plan:vPlan,goal:vGoal})[tab]()}
function dateBtn(id,date,kind){return `<label class="dt">${md(date)} ✎<input type="date" value="${date}" data-${kind}="${id}"></label>`}
function nextFor(o){return msDates(o).filter(d=>d>=TODAY).sort()[0]}
function vToday(){const isT=day===TODAY;let h=`<div class="top"><button class="btn2" data-a="dNav" data-v="-1">‹</button><div style="text-align:center"><div class="h1">${isT?'오늘':md(day)}</div>${isT?`<div class="mut sm">${md(day)}</div>`:`<button class="sm" data-a="dToday" style="color:var(--g);font-weight:700">오늘로</button>`}</div><button class="btn2" data-a="dNav" data-v="1">›</button></div>`;
 // 목표: 다음 단계에서 달성해야 할 것만
 h+=`<div class="card" data-a="tab" data-t="goal" style="cursor:pointer"><div class="lbl">달성할 것</div>${OKR().map(o=>{const nx=nextFor(o);return `<div style="margin-top:8px"><div class="row sb"><b>${DN[o.disc]}</b><span class="mut sm">${nx?msLabel(o,nx)+' '+md(nx):''}</span></div><div class="kv">${o.krs.map(k=>{const t=nx?msVal(o,k,nx):null;if(t==null)return '';const v=krNow(o,k);return `<span>${esc(krName(k))} <b>${v==null?'–':v}</b>/${t}${KRT[k.type].u}</span>`}).join('')}</div></div>`}).join('')}</div>`;
 const S=sessOn(day),evs=EV().filter(e=>e.start<=day&&e.end>=day);
 h+=`<div class="card">${evs.map(e=>`<div class="row" style="margin-bottom:8px"><span class="pill ev">${esc(e.name)}</span></div>`).join('')}`;
 if(!S.length){let nx=null;for(let i=1;i<15&&!nx;i++){const x=addD(day,i);if(sessOn(x).some(s=>!s.done))nx=x}h+=`<div class="st">쉬는 날</div>${nx?`<button class="mut" style="margin-top:6px" data-a="go" data-d="${nx}">다음: ${md(nx)} ›</button>`:''}`}
 S.forEach(s=>{const it=itemsOf(s),ck=s.checks||{};h+=`<div class="ses"><div class="row"><button class="ck ${s.done?'y':''}" data-a="sDone" data-id="${s.id}">${s.done?'✓':''}</button><div class="st">${DN[s.disc]} ${KN[s.kind]}</div>${dateBtn(s.id,s.date,'mv')}</div><div style="margin-top:6px;padding-left:2px">${it.map(x=>`<button class="it ${ck[x.k]||s.done?'y':''}" data-a="iCk" data-id="${s.id}" data-k="${x.k}"><span class="ck ${ck[x.k]||s.done?'y':''}" style="width:22px;height:22px;font-size:12px">${ck[x.k]||s.done?'✓':''}</span><span><span class="t">${esc(x.t)}</span>${x.s?`<span class="s">${esc(x.s)}</span>`:''}</span></button>`).join('')}</div><div class="row" style="margin-top:6px;gap:6px">${['game','drill'].map(k=>`<button class="btn2 sm" style="${s.kind===k?'background:var(--ink);color:#fff':''}" data-a="sKind" data-id="${s.id}" data-v="${k}">${KN[k]}</button>`).join('')}${['S','D'].map(k=>`<button class="btn2 sm" style="${s.disc===k?'background:var(--ink);color:#fff':''}" data-a="sDisc" data-id="${s.id}" data-v="${k}">${DN[k]}</button>`).join('')}<button class="btn2 sm" style="color:var(--r);margin-left:auto" data-a="sRest" data-id="${s.id}">쉬기</button></div></div>`});
 return h+`<button class="btn2" style="margin-top:12px" data-a="sAdd" data-d="${day}">+ 이 날 추가</button></div><div class="mut sm" style="text-align:center;margin-top:12px">영상·숫자는 Slack 테니스 기록함에 · 다음 드릴은 Aside가 여기에 넣어요</div>`}
function vPlan(){const cw=Math.max(1,wkOf(TODAY));let h=`<div class="top"><div class="h1">일정</div></div><div class="card"><div class="lbl">대회</div>${EV().filter(e=>e.end>=addD(TODAY,-30)).map(e=>`<div class="row sb" style="padding:8px 0;border-top:1px solid var(--line)"><span style="min-width:0">${esc(e.name)}<div class="mut sm">D-${Math.max(0,diffD(TODAY,e.start))}</div></span>${dateBtn(e.id,e.start,'ev')}</div>`).join('')}</div>`;
 for(let n=Math.max(1,cw-2);n<=Math.min(lastW(),cw+6);n++){const ws=wkStart(n);h+=`<div class="card" ${n===cw?'id="cur"':''}><div class="row sb"><div class="lbl">${n===cw?'이번 주 · ':''}W${n}</div><span class="mut sm">${md(ws)}~</span></div><div class="wk">`;
  for(let k=0;k<7;k++){const d=addD(ws,k),S=sessOn(d),E=EV().filter(e=>e.start===d);if(!S.length&&!E.length)continue;h+=`<div class="wr"><button class="wd" data-a="go" data-d="${d}">${DOW[pd(d).getDay()]} ${pd(d).getDate()}</button><div class="row" style="flex-wrap:wrap;gap:6px;flex:1">${E.map(e=>`<span class="pill ev">${esc(e.name)}</span>`).join('')}${S.map(s=>`<span class="pill ${s.done?'done':''}">${DN[s.disc]} ${KN[s.kind]}</span>`).join('')}</div>${S[0]?dateBtn(S[0].id,S[0].date,'mv'):''}</div>`}
  h+=`</div></div>`}
 return h}
function vGoal(){const o=OKR().find(x=>x.disc===gdisc),E=okEdit;let h=`<div class="top"><div class="h1">목표</div><button class="btn2" data-a="okEdit">${E?'완료':'조정'}</button></div><div class="seg">${['S','D'].map(k=>`<button class="${gdisc===k?'on':''}" data-a="gDisc" data-v="${k}">${DN[k]}</button>`).join('')}</div>`;
 h+=`<div class="card">${E?`<input class="inp" style="font-weight:800;font-size:18px" data-ot="${o.id}" value="${esc(o.title)}"><div class="row mut sm" style="margin-top:8px">${dateBtn(o.id,o.start,'os')} ~ ${dateBtn(o.id,o.end,'oe')}</div>`:`<div style="font-size:20px;font-weight:800">${esc(o.title)}</div><div class="mut sm">${md(o.start)} ~ ${md(o.end)}</div>`}`;
 h+=o.krs.map(k=>{const v=krNow(o,k),p=krP(k,v);return `<div style="padding:10px 0;border-top:1px solid var(--line);margin-top:8px"><div class="row sb"><b>${esc(krName(k))}</b><span class="mut">${v==null?'–':v} / ${E?`<input class="ti" data-kt="${o.id}:${k.id}" value="${k.target}">`:`<b style="color:var(--ink)">${k.target}</b>`}${KRT[k.type].u}</span></div><div class="bar"><i style="width:${(p||0)*100}%"></i></div></div>`}).join('')+`</div>`;
 const D=msDates(o),nx=nextFor(o);h+=`<div class="card"><div class="lbl">단계 (목표에서 거꾸로)</div><div class="tl">${D.map(d=>{const past=d<TODAY;const ok=past?o.krs.every(k=>{const t=msVal(o,k,d),v=krNow(o,k,d);return t==null||v==null||v>=t}):null;
  return `<div class="ms ${d===o.end?'goal':d===nx?'next':past?(ok?'ok':'miss'):''}"><span class="nd"></span><div class="row sb"><b>${msLabel(o,d)}</b>${E&&d!==o.end?dateBtn(o.id+'|'+d,d,'md'):`<span class="mut">${md(d)}${d===nx?' · 다음':''}</span>`}</div><div class="kv">${o.krs.map(k=>{const t=msVal(o,k,d);if(t==null)return '';return `<span>${esc(krName(k))} ${E?`<input data-mv="${o.id}|${d}|${k.id}" value="${t}">`:`<b>${t}</b>`}${KRT[k.type].u}</span>`}).join('')}</div></div>`}).join('')}</div></div>`;
 return h}

/* 동작 */
function todoPut(id,extra){const t=db.todos.find(x=>x.id===id)||{id};return save('todos',{...t,id,...extra})}
function okrSave(fn){const L=JSON.parse(JSON.stringify(OKR()));fn(L);save('settings',{...ST(),id:'main',okr:L})}
const findS=id=>{for(let n=1;n<=lastW();n++){const s=weekSlots(n).find(x=>x.id===id);if(s)return s}return null};
const act={
 tab:d=>{tab=d.t;render();scrollTo(0,0);if(d.t==='plan'){const c=document.getElementById('cur');if(c)c.scrollIntoView({block:'start'})}},
 dNav:d=>{day=addD(day,+d.v);render()},dToday:()=>{day=TODAY;render()},go:d=>{day=d.d;tab='today';render();scrollTo(0,0)},
 sDone:d=>{const s=findS(d.id);if(!s)return;todoPut(d.id,{done:!s.done,date:s.date,kind:s.kind,disc:s.disc})},
 iCk:d=>{const s=findS(d.id);if(!s)return;const c={...(s.checks||{})};c[d.k]=!c[d.k];const all=itemsOf(s).every(x=>c[x.k]);todoPut(d.id,{checks:c,date:s.date,kind:s.kind,disc:s.disc,...(all?{done:true}:{})})},
 sKind:d=>{const s=findS(d.id);todoPut(d.id,{kind:d.v,date:s.date,disc:s.disc,items:null,checks:{}})},
 sDisc:d=>{const s=findS(d.id);todoPut(d.id,{disc:d.v,date:s.date,kind:s.kind,items:null,checks:{}})},
 sRest:d=>{todoPut(d.id,{hidden:true});toast('쉬기로 바꿨어요')},
 sAdd:d=>{save('todos',{id:'t'+Date.now().toString(36),custom:true,kind:'game',disc:'S',date:d.d,week:wkOf(d.d),title:'단식 게임'});toast(`${md(d.d)}에 추가했어요`)},
 okEdit:()=>{okEdit=!okEdit;render()},gDisc:d=>{gdisc=d.v;render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const f=act[b.dataset.a];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('change',e=>{const el=e.target,x=el.dataset,v=el.value;if(!v&&!x.mv&&!x.kt)return;
 if(x.mv){if(el.type==='date'){const s=findS(x.mv);todoPut(x.mv,{date:v,kind:s?s.kind:undefined,disc:s?s.disc:undefined});toast(`${md(v)}로 옮겼어요`)}else{const[oid,d,kid]=x.mv.split('|');okrSave(L=>{const o=L.find(o=>o.id===oid);o.ms=o.ms||{};o.ms[d]={...(o.ms[d]||{}),[kid]:v===''?null:+v}})}}
 else if(x.ev){const e0=db.events.find(e=>e.id===x.ev);if(e0){const len=diffD(e0.start,e0.end);save('events',{...e0,start:v,end:addD(v,len)});toast('대회 날짜를 바꿨어요')}}
 else if(x.ot)okrSave(L=>{L.find(o=>o.id===x.ot).title=v});
 else if(x.os)okrSave(L=>{L.find(o=>o.id===x.os).start=v});
 else if(x.oe)okrSave(L=>{L.find(o=>o.id===x.oe).end=v});
 else if(x.kt){const[oid,kid]=x.kt.split(':');okrSave(L=>{L.find(o=>o.id===oid).krs.find(k=>k.id===kid).target=+v})}
 else if(x.md){const[oid,d]=x.md.split('|');okrSave(L=>{const o=L.find(o=>o.id===oid);const D=msDates(o).filter(z=>z!==d);o.msd=[...D,v];if(o.ms&&o.ms[d]){o.ms[v]=o.ms[d];delete o.ms[d]}})}});
load();
</script>
